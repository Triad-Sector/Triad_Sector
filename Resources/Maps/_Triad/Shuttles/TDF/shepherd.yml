        i'm your average shipyard worker, i left a note here since i made a slight modification on the shuttle for the TDF. 


        If you look at the shuttle number pad and press 1, you'll activate the sirine on the outer ship!, and if you feels threatened dont worry fam igotchu! just press number 2 to bolt the external airlock!~, and if you press 3 it will close the blast door, going to 4 and you'll bolt the glass airlock!


        Another thing to add is to becarefull when your shield is disabled, it has limited amount of APC so a disabled shield might cripple the ship so becarefull


        hopefully the ship will serve its purpose, stay alive out there and protect the sector!~


        Leave a note or message to us if there's some issue on the ship so we can improve it.


        - Your Shipyard Worker TB



        - PS


        this is interceptor ship so dont try to brawl something.
