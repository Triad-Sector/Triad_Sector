        Every single frakking day on this scrapheap of a ship, the structure, the engines, the CREW are pushed to their absolute limits, and then past them, even though she's a sturdy vessel... NO SHIP IS MEANT TO UNDERGO THIS MUCH CONSTANT STRESS.


        Last engagement blew out most of the internal thrusters when the shielded wings started to wobble... The pilot assures me it's still workable without them despite my insistence on stopping for proper repairs and refits out of them, but noooooo. Apparently a ceremony where we're all expected to stand around in fancy uniform is more important than cutting out the loose scrap on our ship. Or the leaky distro.. Or the, absolute hackjob of wirespool repairs we've been doing over the years that never got to be revisited-
         Whatever, it's not going to be my problem anymore, may this ship rot in the scrapyard. To whomever comes next unfortunate enough to have inherited this flying dumpster fire, save yourself the troubles I went through. Don't overthink it, just smile and nod with a spool of duct tape and grit your teeth when you hear that frakking phrase...
- proto: PaperOffice
  entities:
  - uid: 2244
    components:
    - type: Transform
      rot: 1.5707963267948966 rad
      pos: 1.8968478,15.376035
      parent: 1
    - type: Paper
      content: >-
        [head=1]Silent running and you! [/head]


        Within the CIC (beneath this paper) lies a yellow hazard stripe lined button, pressing this button shuts off your engines lowering your thermal signature.


        Once you press the button, every thruster and machine will go dark for a bit, in it's stock configuration, This blackout will last 22~ seconds


        The SMES array needs time to adjust its pump rate from the sudden shift of load, you can decrease the time it takes for them to do this by upgrading the capacitors within or adding more to the array.


        Once the output stabilizes, machines and engines should see a return to power as they now run off of the SMES battery bank, at full bore you can expect about 150 seconds of silent running before the charge gives out and you are left entirely without power (though if you are parked, that does technically still count as a use of silent running to decrease your thermal signature!)


        Upgrading the batteries within the SMES will allow them to hold more charge and in turn last longer, but be warned! There is little point in upgrading them in a lopsided manner, Strive to achieve an equal amount of maximum charge between them for the array is only as strong as it's weakest link!


        [italic](PS: Crank up the SMES and Substation charge circuit to max in order to build up enough charge to use silent running in the first place!) [/italic]
