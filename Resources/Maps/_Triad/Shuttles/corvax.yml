- proto: BookBase
  entities:
  - uid: 499
    components:
    - type: MetaData
      name: Commanding Corvax
    - type: Transform
      pos: 0.3345189,27.500822
      parent: 1
    - type: Paper
      content: >-
        [head=1]Commanding Corvax[/head]


        [head=3]Commander Corvus' autobiography and a helpful primer for any would be trailblazers[/head]



        [bolditalic]Chapter 1: The fighter is mightier than the formation, early life. [/head]


        In my youth, I was a brash man, abrasive, hot headed, thought I was on top of the galaxy... In a way, I was. At least, in my little pocket, a shining beacon of cocky excellence... Much to the chagrin of my peers. 


        See, being a fighter pilot requires a little extravagance, you can't put just anyone in an expensive coffin and tell them to face death with a wave and a smile. No amount of training can prepare someone to be in full control of their own destiny on razor thin margins of error, it's something you either have, or you do not.

        Sure, you can mitigate loss, you can teach formation and drill so that the warrior spirit inside is supressed into becoming a semi-skilled labourer on the highest turnover rate job in the universe. But in doing so you make these fine needles the same brute force hammers they go up against, and to save you a few dozen good birds turning into hundreds of thousands of scrap parts in the blink of an eye... I can just tell you that to do so, is inadvisable. 


        No, formation has its uses, but that use is for initial contact, it is for ships of the line to follow and for parades. A fighter is best used in-between formal formations, to disrupt the enemies own flow of textbook actions, to exploit the weaknesses present, if nothing else, to merely annoy their foe until a chance to make a daring dive between flak clouds proves most beneficial to the wider fight.. 

        To illustrate this, I will inform you, that there's three types of pilots. Those who seek a paycheck, those who live for pride, and those who can tell the tide of a battle.

        All three have the capability to turn the tide of a battle, but... The mercs just in it for the fancy way of life will rarely do so in the risky manners required of them, the lowest common denominator picking low hanging fruit, scratching tally marks on damaged foes and turning tail when the odds start to look improbable.

        The ones who live for pride have the opposite issue, they will look at impossible odds and fly headfirst into them to show off, to feel the adrenaline as their fate lies on a razors edge, to come out on top and gloat in the recroom and to drown their sorrows with a bottle under a shower head. Fortunately, most of this type end up burning bright flying too close to the sun before the ticking time bomb that is their own interpersonal and emotional issues arise to ruin morale within the crew. Salute them as heroes and remember them by their accolades, not by the tension they caused while they were around... Encourage the behaviour though, and some of the more high-functioning lunatics might just move on to be like me, living long enough through odds they shouldn't have to acquire a deeper understanding of conflict itself atop a dangerous cache of raw skill. Combine the two, and you have your consistent tide turners.


        The naming of this chapter is intentionally false, the fighter is not mightier than the formation, in fact, it's biggest strength lies in formation, only... Not the kind that can be taught, the kind that has to be lived through first-hand. It takes an excellent pilot to know what they should be doing individually in the moment to exploit the ever changing tide of battle.. But it takes a tightknit group of masterwork pilots to have such intrinsic trust in each other to know when to weave together and when to scatter, to make moves that seem disconnected from one another or outright wrong.. Only for it all to come together in the end as the invisible thread of fate is weaved so delicately in their favour.


        [bolditalic]Chapter 2: The struggle of command, the duty to take it. [/head]

        The previous chapter though it was made off of my experiences, had little to do with my own life, truthfully, if I were to start reminiscing. The length of this book would be tenfold filled with amusing and astounding yet ultimately useless trifle.. Additionally, in my age, the rage of thinking back to my 'superiors' at the time might burst a blood vessel in my brain near the lodged shrapnel and leave these pages a draft for some publication to piggyback off of after my untimely death.. Whom I'm certain would have no shortage of accolades to write about inspiring the next generation of pilots to seek the stars in my very own make and model of fighter craft with none of the practical knowledge required to give them a better fighting chance.


        Regardless, to the ones that make it this far both into the book and into their own careers. Here's a harrowing thought. [bolditalic]You won't fly forever.[/head]

        At some point, the skills you have in flying and the knowledge you acrew are better suited in mentoring and commanding, it is more efficient to cycle you out of active duty just after your peak to inspire the next generation of squadrons, individually, you won't be able to train them up to your level or tell them to just do what you could, but over the course of all of them.. Ultimately, you must accept that in the bigger picture of the battlescape, your direction affecting so many starts to outweigh what you individually can accomplish on a tactical level.. Then, on a strategic one.. You get a larger list of candidates who through their own trials and tribulations can be even better than you, or at the very least a handful that combined make up the difference, who then in turn continue the cycle.


        When in your career you have to take this mantle depends entirely on how competent the ones above you are, you could be lucky and have the best by your side, I thought I was lucky, until the man I thought was the best was usurped through politics. The new commander probably thought he was really unlucky, to have his fighter coverage fail to shoot down a torpedo heading right to his helm. Truthfully, he was just inattentive and failed to question why the crew rotation orders of the day were altered. Though I.. I do still wish I handled the matter with more tact, but I knew not of politics at the time, only the cold and calculated actions I could take right in front of me to make things better for the crew in the long run, an action someone had to take before things got worse. That's the weight of command, to knowingly make awful choices and to step up to bear the brunt of everyone's woes as your own. 

        You must.. Lose yourself, parts of yourself at least, you cannot be only you any longer. You have to be the ship, you have to be the crew, for they are all extensions of you now and like a lumbering giant the reach of your arms have both their success and failure magnified in ripples across the ocean of uncertainty you're forced to navigate.


        You must be in tune with every minute detail and how they work to turn the larger cogs of war, this was the hard part of learning the tide of battle as a pilot.. Except, so so much worse. So much more hazy, so much more to consider, so much less feedback, so many more stakes, so much more responsibility. You are no longer the master of your own destiny, you cannot needlessly take risk any longer with the clarity of mind that it's solely your life on the line, but the echoing screams of everyone who looks up to you and acts on your orders.


        This is the reality of it, no one is perfect for the job, there is no right way to do it, only a thousand wrong ways with varying levels of catastrophe to them. Study every approach and every facet, and you might just come out with a slightly less bad outcome compared to the rest...


        [bolditalic]Chapter 3: Corvus Industries. [/head]

        Well, it's time to get into a little more about me now. Considering my name is on the ship you're reading this from, in the very same room layout I wrote this within and largely the same ship I spent all those years serving with... 


        After stepping up to take the mantle of captain.. Then admiral, ultimately I drifted away from the wing that brought me up to make my own, one which I alone commanded every aspect of, the design of the ships, the screening and training of the crew, the budget and the million other little things you have to worry about, simply put. I couldn't trust anyone else to enact the vision my experience granted me to make the absolute most of my capabilities. My carrier and compliment of fighters all held under lock and key to usurp and surprise the competition... All the headache I suffered through to achieve it.. Was worthwhile, it had it's ups and downs as all things in life do but, I couldn't complain about the results, in fact, they're something I can be damn proud of.. In my age though, I've realized there are facets in design and combat I've began to cement into, no matter how much I preach adapting I never did upgrade from landline phones for communication throughout the ship, I never entertained the ideas my engineers brought up to me for their frivolous projects, so I never did get to enjoy some of the luxuries provided by their advancements.. Though, being a little hungry for more, never complacent or reliant on the digital has its merits, it's always all a matter of compromise.


        So, after flying, fighting and figuring out how the hells to run an entire battlegroup for more than what one persons lifetime should ever have to see, I pass the culmination of my works onto the next generation of fighters and commanders in the form of this rugged and reliable fleet compliment. It has everything you could possibly need to make it work so long as you work with it and give it the commitment it deserves. It could likely be improved seeing as how the tides have turned in fields I never even stopped to consider, but all the fancy tech in the world is dead in the hands of a complacent pilot facing one of my birds flown by an appropriately mad soul. If you have that fire burnin' within you, you'll see it through and hopefully use this ship as a springboard to make something beyond my comprehension that goes on to inspire the cycle further, the ones picking up the pieces you leave to make something greater still.. 

        If not, get the frak off my ship. I may be half blind and nowhere near as capable as I once was but I bet I could still hop in a crow and have at least one more blaze of glory if sufficiently agitated, so leave me to my geese farm and if you start to make a shame out of my legacies name you best make sure it doesn't make it through my hearing aid... Oh yeah, this isn't something the manual for the crow will tell you but the hearing loss is service related, you're just not meant to say that part aloud. If you really like a certain pilot and think they might be useful in 10-20 years time, maybe invest in some noise cancelling headphones for them.


        My editors tell me I can't fit the several pages of actual tips like the one above in this hardcover so you'll just have to use your own common frakkin' sense instead. Good luck and remember. [bolditalic] IT'LL BUFF OUT.[/head]
