      content: >2-

        [head=1][color=#1c6bba]TERRALITH RESEARCH CENTER[/color][/head]


        [head=2]EXCELLENCE IN INNOVATION — FACILITY WELCOME MEMORANDUM[/head]

        [align=center][b]WELCOME TO YOUR NEW ASSIGNMENT[/b][/align]

        [hr]

        [align=center][i]"Building Tomorrow's Thresholds, Today."[/i][/align]


        [bold][head=3]WELCOME PERSONNEL[/bold][/head]

        On behalf of Executive Directorate and clearance of Solarian Directive, welcome to the [bold]Terralith Research Center[/bold]. You have been selected to serve at one of our most vital frontier research installations. The work conducted within these bulkheads defines the cutting edge of industrial, technological, and scientific progress.



        [head=3]FACILITY PROTOCOLS & EXPECTATIONS[/head]


        [bullet] [b]Display Credentials:[/b] Your clearance ID must remain visible at all times. Unauthorized access to restricted research sectors will result in immediate detention and security review.

        [bullet] [b]Report Anomalies:[/b] Terralith thrives on precision. Any structural breaches, rogue automated behaviors, or unaccounted research material must be reported immediately to Department Leads.

        [bullet] [b]Departmental Integrity:[/b] Scientific breakthrough using Data Miner Disk requires absolute discipline. Adhere strictly to hazardous containment guidelines and standard operating procedures.

        [bullet] [b]Corporate Loyalty:[/b] Remember that all research materials, data logs, and technological assets produced on site remain the exclusive property of the organization.



        [head=3]DEPARTMENT LOCATIONS[/head]


        [bullet] Autonomous Drone docking bay

        [bullet] Corporate Conference

        [bullet] Living Quarters

        [bullet] Data Vault

        [bullet] Nuclear Engine Room

        [bullet] Security

        [bullet] Medical

        [bullet] Corporate Bar



