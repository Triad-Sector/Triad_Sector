    - type: Paper
      content: >2-

        [head=1][color=#1c6bba]TERRALITH RESEARCH CENTER[/color][/head]


        [head=2][color=red]SYSTEM-WIDE DEFENSE & EVACUATION ORDER[/color][/head]


        [align=center][b]COMMUNICATION LOG — SOLARIEN COMMAND RELAY[/b][/align]

        [hr]


        [b]DATE/TIME:[/b] [color=gray]TIMESTAMP REDACTED[/color]

        [b]SYSTEM THEATER:[/b] Outer Rim — Solarian Directive Patrol Grid

        [b]CHANNEL:[/b] Encrypted Fleet-to-Station Relay [b][PRIORITY ALPHA][/b]

        [b]PARTICIPANTS:[/b]

        [bullet] [b]Station Dir. Vance:[/b] Dr. Arthur Vance (Terralith Director Lead)

        [bullet] [b]Rear Adm. Kross:[/b] Commander Elena Kross (Admiral of Solarian Directive Zulu Fleet)


        [head=3]LOG TRANSCRIPT[/head]


        [b]<00:01> [color=#1c6bba]Dir. Vance:[/color][/b] Admiral Kross, long-range telemetry is showing massive drive flare signatures entering the system. The local defense grid is lighting up like a Christmas tree. What is the status of the outer system perimeter?


        [b]<00:10> [color=#ff4444]Rear Adm. Kross:[/color][/b] The frontline in the outer belt has completely collapsed, Director. The Civilian Defense Force has mobilized a system-wide offensive. Their war fleets are pushing through the planetary threshold and closing in on your sector rapidly.


        [b]<00:22> [color=#1c6bba]Dir. Vance:[/color][/b] A war fleet?! They're an insurgent faction! How do rebels have enough naval tonnage to push back Solarian Directive battlecruisers? W-What about the Directive's automated fleet networks? you do have have full combat drone swarms deployed across the outer relay stations!


        [b]<00:33> [color=#ff4444]Rear Adm. Kross:[/color][/b] We are currently rerouting every available combat drone unit in the system to set up a delaying screen in deep space. But make no mistake when i say this. Those drones are only meant to buy time, not win this engagement. Those bastard rather die to blow your facility after what we did to their chain of command. Solarian Command has declared the system [color=red]UNSAFE[/color] and issued a total evacuation order for your facility, director.


        [b]<00:45> [color=#1c6bba]Dir. Vance:[/color][/b] WHAT?!! We can't just abandon the installation! The Tech Disk Printer is halfway through fabricating Classified Research Package Alpha! If we cut power now, the data matrices will corrupt! We need time for a controlled shutdown before we evacuate!


        [b]<00:56> [color=#ff4444]Rear Adm. Kross:[/color][/b] You don't have time for a controlled shutdown, Director! The space-bound drones will hold the CDF's vanguard for maybe thirty minutes before their fleet overwhelms the perimeter. When those drone hulls burn out, you will have CDF boarding gunships sitting right outside your airlocks.


        [b]<01:08> [color=#1c6bba]Dir. Vance:[/color][/b] Do you have any idea how much capital was poured into this facility?! The Solarian Directive board members and private stakeholders treated this station as their premier technological wonder! If we abandon this facility to be destroyed or looted by insurgents, those investors will have my head!


        [b]<01:19> [color=#ff4444]Rear Adm. Kross:[/color][/b] Then it's your damn fucking job to make sure none of them able to be taken! Go grab your resource collector drones, strap them to the hull, and turn off the anchor. Set their destination to [Data redacted] and i will make the drones that come across your facility redirect to it and defend it.


        [b]<01:31> [color=#1c6bba]Dir. Vance:[/color][/b] Are you out of your mind?! If we sever the main anchor and use jury-rigged resource drones as thrust, it'll be drifting blind without any form of navigation! A single rogue meteor or stray interstellar mass could tear the hull wide open! I cannot risk the Tech Disk Printer being smashed to pieces by a random space rock!


        [b]<01:42> [color=#ff4444]Rear Adm. Kross:[/color][/b] I would rather see this facility atomized by an asteroid and lost in the deep black forever than let the insurgents rip out our data cores. If the CDF gets their hands on what's inside that printer, they'll have the blueprints to match our fleet capability in months.


        [b]<01:51> [color=#1c6bba]Dir. Vance:[/color][/b] You're condemning billions credits worth of research to the void...


        [b]<01:58> [color=#ff4444]Rear Adm. Kross:[/color][/b] I am ensuring the survival of the Solarian Directive Jupiter, Director. As you said with your head, my head are also on the table if i did not evacuate you or deny the enemy access to the facility. Sound the evacuation alarms, Director. Unmoor the station and kick the thrusters, or I will order my own ships to torpedo your facility to fulfill my mission. Your chocie, Kross out.


        [b]<02:07> [color=#1c6bba]Dir. Vance:[/color][/b] [i][heavy sigh][/i] ...Understood. Disengaging station tethers and overriding resource drone nav-computers now. God save us all.


        [color=red][b]-- END TRANSMISSION TRANSCRIPT --[/b][/color]

        Logged by System Telemetry Network // Ref: TRC-SYS-EVAC-09
