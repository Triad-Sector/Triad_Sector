    - type: Paper
      content: >2-

        [head=1][color=#1c6bba]TERRALITH RESEARCH CENTER[/color][/head]


        [head=2][color=#666666]SECURITY & ASSET PROTECTION MEMORANDUM[/color][/head]


        [align=center][b]WARNING: AUTOMATED DEFENSE PROTOCOL — TECH DISK PRINTER[/b][/align]


        [b]MEMO REF:[/b] TRC-SEC-089

        [b]SUBJECT:[/b] Restricted Vault Access & Automated Security System

        [b]CLEARANCE LEVEL:[/b] [color=red]AUTHORIZED PERSONNEL ONLY[/color]



        [head=3]I. ASSET OVERVIEW[/head]

        The [b]Tech Disk Printer[/b] remains the primary asset for encoding and fabricating advanced research schematics within the Terralith Research Center. Due to the high value of proprietary data stored within this system, the printing unit operates under hard-coded, automated security containment.


        [head=3]II. AUTOMATED SECURITY PROTOCOLS[/head]

        The printer environment is continuously monitored by integrated defense sentries and drones programmed to enforce immediate lethal response protocols upon any breach. In any case of hull breach happened, the blast doors will be closed until it has been resolved.


        [bullet] [b]Access Requirement:[/b] Entry into the Tech Disk Printer chamber requires an active, verified [color=blue]Solarian Directive[/color] credentials match or a valid [color=blue]Terralith ID[/color].

        [bullet] [b]Threat Response:[/b] Sentry systems will instantly transition to [color=red]HOSTILE[/color] state if an unverified life sign or unregistered suit signature enters the scanning radius.

        [bullet] [b]Targeting Parameters:[/b] Automatic target acquisition triggers without verbal warning or grace period.

        [bullet] [b] In case of breach and atmospheric instability occur, the vault blastdoor will sealed until the air outside or inside the vault entry are deemed clear.


        [head=3]III. PERSONNEL DIRECTIVES[/head]

        [bullet] [b]Verify Identification:[/b] Always double-check that your Terralith ID is equipped and active before crossing the warning threshold.

        [bullet] [b]Escort Protocol:[/b] Unregistered visiting researchers or contractors [color=yellow]MUST NOT[/color] approach the vault entry without an authorized Solarian Directive or Terralith handler present.

        [bullet] [b]System Malfunctions:[/b] In the event of an IFF failure or false positive alert, retreat from line-of-sight immediately and contact Security.


        [hr]

        [align=center][color=#1c6bba][b]UNAUTHORIZED ACCESS WILL BE MET WITH IMMEDIATE LETHAL FORCE[/b][/color][/align]

        [align=right][i]Issued by Terralith Security Division[/i][/align]
