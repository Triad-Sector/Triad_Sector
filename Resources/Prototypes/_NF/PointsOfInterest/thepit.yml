# Notes:
# Down at your local saloon
- type: pointOfInterest
  id: ThePit
  parent: [BasePOI, BaseRepairablePOI]
  name: "The Pit"
  minimumDistance: 5200
  maximumDistance: 6200
  spawnGroup: Arena
  gridPath: /Maps/_NF/POI/arena.yml
  addComponents:
  # Triad: on the bus route. Berth is any of the four hull docks on the arms, uids 1558-1569 in the
  # map, all tagged DockTransit. They open through an external airlock into the arm lounges. The
  # south gantry row used to carry the tag and dropped passengers in vacuum.
  - type: StationTransit
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: ThePit
  mapName: "The Pit"
  mapPath: /Maps/_NF/POI/arena.yml
  minPlayers: 0
  stations:
    ThePit:
      stationProto: DeadDropFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: "The Pit"
