# Notes:
# Down at your local saloon
- type: pointOfInterest
  id: ThePit
  parent: [BasePOI, BaseRepairablePOI]
  name: "The Pit"
  minimumDistance: 5200
  maximumDistance: 6200
  spawnGroup: Arena
  gridPath: /Maps/_NF/POI/arena.yml
  addComponents:
  # Triad: on the bus route. Berth is the west triple on the south face, uids 3017/3018/3054 in the
  # map, tagged DockTransit.
  - type: StationTransit
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: ThePit
  mapName: "The Pit"
  mapPath: /Maps/_NF/POI/arena.yml
  minPlayers: 0
  stations:
    ThePit:
      stationProto: DeadDropFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: "The Pit"
