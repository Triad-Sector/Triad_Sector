- type: gameMap
  id: CaseysCasino
  mapName: "Crazy Casey's Casino"
  mapPath: /Maps/_NF/POI/caseyscasino.yml
  minPlayers: 0
  stations:
    CaseysCasino:
      stationProto: DeadDropFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: "Crazy Casey's Casino"
