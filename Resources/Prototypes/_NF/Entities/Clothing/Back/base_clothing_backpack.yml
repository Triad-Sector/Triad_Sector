
- type: entity
  abstract: true
  id: NFBackpackHiddenStash
  components:
  - type: Appearance
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
    enable: false
  - type: Transform
    anchored: false
  - type: AnchorableStorage

- type: entity
  parent: [ ClothingBackpack, NFBackpackHiddenStash ]
  id: NFClothingBackpack
  components:
  - type: Storage
    # Triad: Make backpacks a bit more versatile by allowing huge items. Should make them a bit more useful when compared to backpacks and satchels. Made all backpacks smaller but ginormous, so you can store them in a stash or deposit box better.
    #maxItemSize: Large
    maxItemSize: Huge
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,6,3
  - type: Item
    size: Ginormous
    shape:
    - 0,0,3,3
    # End Triad

- type: entity
  parent: [ ClothingBackpackDuffel, NFBackpackHiddenStash ]
  id: NFClothingDuffel
  components:
  - type: Storage
    maxItemSize: Huge
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,7,4
  - type: Item
    # Triad: Made all backpacks smaller but ginormous so you can store them between rounds easier.
    size: Ginormous
    shape:
    - 0,0,3,3
    # End Triad

- type: entity
  abstract: true
  parent: NFClothingBackpack
  id: NFClothingMessenger
  components:
  ## One 4x4 pocket, four 2x2 pockets
  - type: Storage
    maxItemSize: Large # Triad: Fixes a potential issue where the messenger bag could steal the backpack's upsides from parenting to it
    grid:
    - 0,0,1,1
    - 0,3,1,4
    - 3,0,6,3
    - 8,0,9,1
    - 8,3,9,4

  # Alternative layouts
  ## Two 2x1 pockets, one 2x3 pocket and one 6x3 pocket
