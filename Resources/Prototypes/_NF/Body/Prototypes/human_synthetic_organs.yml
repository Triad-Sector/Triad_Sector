- type: body
  id: HumanSyntheticOrgans
  name: "human synthetic"
  root: torso
  slots:
    head:
      part: HeadHuman
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    torso:
      part: TorsoHuman
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganSyntheticHeart
        lungs: OrganHumanLungs
        stomach: OrganHumanStomach
        liver: OrganSyntheticLiver
        kidneys: OrganSyntheticKidneys
    right arm:
      part: RightArmHuman
      connections:
      - right hand
    left arm:
      part: LeftArmHuman
      connections:
      - left_hand
    right hand:
      part: RightHandHuman
    left_hand: # Triad - only one hand
      part: LeftHandHuman
    right leg:
      part: RightLegHuman
      connections:
      - right foot
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
    right foot:
      part: RightFootHuman
    left foot:
      part: LeftFootHuman
