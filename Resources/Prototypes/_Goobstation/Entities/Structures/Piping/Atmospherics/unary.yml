- type: entity
  parent: HeatExchanger
  id: HeatExchangerInline
  name: inline radiator
  suffix: DEPRECATED # Triad: uncraftable legacy; zero-flow device only gets the static conductance floor
  description: An obsolete radiator design with no flow path. Transfers a trickle of heat between the pipe and its surroundings. A standard radiator with proper coolant flow far outperforms it.
  components:
  - type: Sprite
    sprite: _Goobstation/Structures/Piping/inlineradiator.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: heInlineStraight
      map: [ "enum.SubfloorLayers.FirstLayer" ]
    - state: heInlineStraight # Triad: glow overlay (visualizer inherited from HeatExchanger)
      map: [ "enum.RadiatorVisualLayers.Glow" ]
      shader: unshaded
      visible: false
  - type: HeatExchanger
    inlet: pipe
    outlet: pipe
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
  - type: Construction
    graph: GasBinary
    node: inlineradiator

- type: entity
  parent: HeatExchangerInline
  id: HeatExchangerInlineBend
  components:
    - type: Sprite
      layers:
      - sprite: Structures/Piping/Atmospherics/pipe.rsi
        state: pipeBend
        map: [ "enum.PipeVisualLayers.Pipe" ]
      - state: heInlineBend
        map: [ "enum.SubfloorLayers.FirstLayer" ]
      - state: heInlineBend # Triad: glow overlay
        map: [ "enum.RadiatorVisualLayers.Glow" ]
        shader: unshaded
        visible: false
    - type: HeatExchanger
      inlet: pipe
      outlet: pipe
    - type: NodeContainer
      nodes:
        pipe:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: SWBend
    - type: Construction
      graph: GasBinary
      node: bendinlineradiator
