- type: entity
  id: WeaponMechCombatMissileRack8
  name: SRM-8 Light Rocket Rack
  description: A cmbat-exo mounted rocket rack, that fires 4 light rockets in a quick burst. Takes awhile to re-arm # Triad.
  suffix: Mech Weapon, Gun, Combat, Light Missile
  parent: [ BaseMechWeaponRange, CombatMechEquipment ]
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    state: mecha_missilerack
  - type: Gun
  # Mono start
    fireRate: 1
    projectileSpeed: 18 # Mono
    burstFireRate: 9 #Triad. 3->9, increased its speed as moving mid burst will cause it to veer in a weird way. So its now a short, high burst but high cooldown burst.
    shotsPerBurst: 4 #Triad. 6->4, to compensate for the much faster burst.
    burstCooldown: 25 #Triad, 5->25. Much longer burst cooldown, intended for a "one and switch", to be used in conjunction with other hardpoints.
    selectedMode: Burst
    availableModes:
      - Burst
  # Mono end
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: BulletWeakRocket
    fireCost: 100 # 25->100 Mono
  - type: Appearance
  - type: AmmoCounter

