# TDF
- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetTdf
  name: TDF headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyNfsd
  - type: Sprite
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi
  - type: Clothing
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi

