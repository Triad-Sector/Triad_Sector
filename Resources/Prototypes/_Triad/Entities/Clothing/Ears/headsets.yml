# TDF
- type: entity
  parent: BaseClass2AShipContrabandSilent
  id: BaseTDFHeadset
  abstract: true
  components:
  - type: Tag # Ignore Chameleon tags
    tags: []

# Used by Cadets and Enforcers - starts with no fireteam channels
- type: entity
  parent: [ClothingHeadset, BaseTDFHeadset]
  id: ClothingHeadsetTdf
  name: TDF headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTdf
  - type: Sprite
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi
  - type: Clothing
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi
  - type: Tag # Ignore Chameleon tags
    tags: []

- type: entity
  parent: [ClothingHeadsetAlt, BaseTDFHeadset]
  id: ClothingHeadsetAltTdf
  name: TDF over-ear headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTdf
  - type: Sprite
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi
  - type: Clothing
    sprite: _Triad/Clothing/Ears/Headsets/tdf.rsi
  - type: Tag # Ignore Chameleon tags
    tags: []

# Used by PTL - starts with no fireteam channels
- type: entity
