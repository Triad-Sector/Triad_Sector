  name: TDF command over-ear headset
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
      - EncryptionKeyTdf
      - EncryptionKeyCommand

# Used by LT and CE - starts with all fireteam channels and TFA comms
- type: entity
