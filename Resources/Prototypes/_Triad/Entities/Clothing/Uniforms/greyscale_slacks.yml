- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitColorSlacksBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Triad/Clothing/Uniforms/Jumpsuits/greyscale_slacks.rsi
    layers:
    - state: icon
      color: "#ffa69b"
    - state: slacks-icon
      color: "#503400"
    - state: belt-icon
    - state: buckle-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ffa69b"
      right:
      - state: inhand-right
        color: "#ffa69b"
  - type: Clothing
    sprite: _Triad/Clothing/Uniforms/Jumpsuits/greyscale_slacks.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#ffa69b"
      - state: slacks-equipped-INNERCLOTHING
        color: "#503400"
      - state: belt-equipped-INNERCLOTHING
        color: "#272624"
      - state: buckle-equipped-INNERCLOTHING
        color: "#e4cc8a"

