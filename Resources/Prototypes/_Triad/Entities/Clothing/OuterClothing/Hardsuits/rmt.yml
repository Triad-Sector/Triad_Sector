- type: entity
  parent: [ ClothingOuterHardsuitBase ]
  id: ClothingOuterHardsuitIndustrialEngi
  name: RMT "Korolev" industrial engineering hardsuit # heavy high tier engi/atmos suit With decent protection. Worse than SCAF, CE, or Atmos at any one thing.
  description: A heavy-duty engineering suit designed to protect the modern shipwright from occupational hazards. Includes an asbestos lining to moderately improve fire survivability. Named in honor of the engineer who carried the first human into space.
  components:
  - type: Sprite
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/rmt-korolev.rsi
  - type: Clothing
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/rmt-korolev.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.03 # Slightly better than engi suit
    lowPressureMultiplier: 1000
  - type: TemperatureProtection # Added atmos temperature protection, 10x weaker than atmos suit
    heatingCoefficient: 0.010
    coolingCoefficient: 0.010
  - type: FireProtection # Added fire protection, 2x weaker than atmos suit.
    reduction: 0.4
  - type: ExplosionResistance
    damageCoefficient: 0.35 # Slightly better than engi suit
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.7
        Piercing: 0.45
        Heat: 0.65
        Radiation: 0.2 # Equivalent to engi suit
        Caustic: 0.4
  - type: StaminaDamageResistance # Stamres
    coefficient: 0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: ToggleableClothing # This is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitRmtL27
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: StaticPrice
    price: 1250
    vendPrice: 7500

