- type: entity
  parent: [ClothingOuterHardsuitSyndieElite, EnergyShieldClothing, BaseFactionGearSDT3, BaseClass2AShipContraband]
  id: ClothingOuterHardsuitSdHeavy
  name: K-3000 "Dyson" heavy nanomesh exoskeleton
  description: A bleeding-edge Exoskeleton featuring an overclocked shield projection matrix and a symbiotic nanite swarm. The nanites can be projected into a static barrier. Should anything pierce the shield, the suit is layered with heat-shielding tiles sourced from solar diving platforms.
  components:
  - type: Sprite
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/sd-heavy.rsi
  - type: Clothing
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/sd-heavy.rsi
  - type: ToggleableClothing
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitSdHeavy
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: FireProtection
    reduction: 0.8
  - type: Armor # Placeholder values, please rebalance once this is no longer just an admeme item.
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.5
        Heat: 0.2
        Radiation: 0.1
        Caustic: 0.3
  - type: Item
    size: Huge
  - type: ClothingSpeedModifier
    walkModifier: 0.90
    sprintModifier: 0.90
  # Shielding
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.1
        Slash: 0.1
        Piercing: 0.1
        Heat: 0.1
    activeBlockModifier:
      coefficients:
        Blunt: 0.1
        Slash: 0.1
        Piercing: 0.1
        Heat: 0.1
      flatReductions:
        Heat: 5
    passiveBlockFraction: 1.0
    activeBlockFraction: 1.0
    isClothing: true
  - type: Damageable
    damageContainer: Shield
  - type: Battery
    maxCharge: 30
    startingCharge: 30
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 1
  - type: RechargeableBlocking
    chargedRechargeRate: 0
    dischargedRechargeRate: 0.3
  - type: UseDelay
    delay: 10
  - type: PointLight
    enabled: false
    radius: 1.4
    energy: 2
    color: "#79f2f2"
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSolarianHeavy
      params:
        volume: 6
  - type: ActionGrant
    actions:
    - ActionForceWallDyson
  - type: ItemActionGrant
    actions:
    - ActionForceWallDyson
    activeIfWorn: true

