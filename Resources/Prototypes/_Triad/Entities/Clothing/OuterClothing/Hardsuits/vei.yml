- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseFactionGearOtherFactionT3 ]
  id: ClothingOuterHardsuitVeiExplorer
  name: VEX MK4 'Explorer' hardsuit
  description: An incredibly rare exploration and salvager hardsuit, seemingly produced by the Void Enigma Institute.. It has plastitanium armor, a reinforced plasma glass visor, and an unknown alloy that resists genetic and radiation damage very well. Very expensive and sought after.
  suffix: Do not give this suit to anyone PLEASE PLEASE PLEASE PLEASE PLEASE, the only reason this item exists is for mapping in the future # REMOVE THIS WHEN WE ACTUALLY ADD IT
  components:
  - type: Sprite
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/vei-explorer.rsi
  - type: Clothing
    sprite: _Triad/Clothing/OuterClothing/Hardsuits/vei-explorer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: Item
    size: Ginormous
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.2
        Caustic: 0.1
        Cellular: 0.6
  - type: StaminaDamageResistance
    coefficient: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: FireProtection
    reduction: 0.25
  - type: HeldSpeedModifier
