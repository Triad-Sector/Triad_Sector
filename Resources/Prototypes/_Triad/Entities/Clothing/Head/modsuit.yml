- type: entity
  parent: BaseClothingModsuitHelmet
  id: ClothingModsuitHelmetOverseer
  name: prosper modsuit helmet
  description: A specialised helmet to protect the Overseer from attacks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Triad/Clothing/Head/Modsuits/overseer.rsi
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      - state: visor
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.95
        Heat: 0.95
        Radiation: 0.9
  #THIS WILL BE REPLACED WITH MODULE ↓↓ (maybe?)
  - type: ToggleableVisuals
    spriteLayer: light
  - type: PointLight
    enabled: false
    radius: 5
    energy: 3
    lightMask: ConeSingle
    autoRot: true
    netsync: false
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: ItemTogglePointLight
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        minValue: 0.1
        maxValue: 2.0
        isLooped: true

- type: entity
  parent: [BaseClothingModsuitHelmet]
  id: ClothingModsuitHelmetHZDBesieger
  name: HZD Sallet
  description: The red glow of its optics have been the last thing many pirates have seen before being engulfed in explosions.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Triad/Clothing/Head/Modsuits/HZDBesieger.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 2
    isEquipment: true
    toggleAction: PulseThermalVision
