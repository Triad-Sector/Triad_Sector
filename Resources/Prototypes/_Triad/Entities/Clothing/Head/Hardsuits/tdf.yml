- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase]
  id: ClothingHeadHelmetHardsuitTdf
  name: TA-21 helmet
  description: The interchangeable helmet system for the majority of TA-21 hardsuits. Has a newly fitted night vision optic, compared to NanoTrasen's original N-20 design.
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag # Ignore Chameleon tags
    tags: []
  - type: Sprite
    sprite: _Triad/Clothing/Head/Hardsuits/tdf-ta21.rsi
  - type: Clothing
    sprite: _Triad/Clothing/Head/Hardsuits/tdf-ta21.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision # Gen 1 monotube
    relayOverlay: true
    goggleEffect: true
    action: ActionToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    lightingColor: "#FFFFFF32"
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
  - type: PointLight
    color: "#F5EDE5"

