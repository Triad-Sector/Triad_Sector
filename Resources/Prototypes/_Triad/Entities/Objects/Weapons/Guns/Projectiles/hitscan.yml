- type: entity
  parent: BasicHitscan
  id: LightTurretLaser
  name: light turret laser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 3
        Shock: 3
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: muzzle_beam_light_overcharged
    travelFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: beam_light_overcharged
    impactFlash:
      sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/small_laser.rsi
      state: impact_beam_light_overcharged

- type: entity
  parent: BasicHitscan
  id: LessLethalLightTurretLaser
  name: less-lethal light turret laser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 2
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_omni
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_omni
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_omni
