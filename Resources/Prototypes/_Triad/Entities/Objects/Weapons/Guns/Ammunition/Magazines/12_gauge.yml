- type: entity
  id: BaseShortMagazine12_gauge
  name: box magazine (12 gauge shells)
  parent: [ BaseItem, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
    - Magazine12_gaugeBuckshot
    - ShortMagazine12_gaugeBuckshot
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - ShellShotgun12_gaugeBuckshot
    capacity: 8
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Ammunition/Magazines/12_gauge/12_gauge_boxmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: ShortMagazine12_gaugeEmpty
  name: box magazine (12 gauge shells any)
  suffix: empty
  parent: BaseShortMagazine12_gauge
  components:
  - type: BallisticAmmoProvider
    proto: null

