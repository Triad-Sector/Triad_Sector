- type: entity
  id: BaseMagazine185x76mm
  name: "box magazine (18.5x76)"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - Magazine185x76mm
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge185x76mm
    proto: Cartridge185x76mm
    capacity: 10
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Ammunition/Magazines/18.5x76mm/18.5x76mm_magazine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-5
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

