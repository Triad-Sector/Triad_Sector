- type: entity
  parent: BaseBullet
  id: ShrapnelCluster
  name: fragment (shard, lethal)
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Slash: 8
    armorPenetration: -0.1
  - type: TimedDespawn
