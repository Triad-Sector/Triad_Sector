- type: entity
  parent: [Paper, BaseClass2AShipContrabandSilent]
  id: PaperCoordinatesSolarianDirective
  name: FSR ministry of defence notice
  description: A professional digital document with a biometric lock, used by the Federated Solarian Republic to sent out important classified messages.
  #categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Triad/Objects/Misc/bureaucracy.rsi
    layers:
    - state: sol_paper
    - state: sol_paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
  - type: Paper
    content: secret-coordinates-sol-directive-text # Default contents, will be edited.
    stampedBy:
    - stampedName: stamp-component-stamped-name-fsr-ministry-of-defence
      stampedColor: "#4c55d8"
    stampState: null
    destroyOnFax: true
    destroyMessage: fax-delete-paper-generic
  - type: PaperVisuals
    backgroundModulate: "#d0e0fd"
  - type: Tag
    tags:
    - Document
    - Paper
    - NFPaperStampProtected
