- type: entity
  parent: BasePlushie
  id: PlushieProtogen
  name: protogen plushie
  description: An adorable stuffed toy that resembles a protogen; cute, fluffy and metallic. Now without sentience!
  components:
  - type: Sprite
    sprite: _Triad/Objects/Fun/plushies.rsi
    state: plushie_protogen
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Toys/toysqueak2.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/toysqueak2.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/toysqueak2.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/toysqueak2.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/Items/Toys/toysqueak2.ogg
