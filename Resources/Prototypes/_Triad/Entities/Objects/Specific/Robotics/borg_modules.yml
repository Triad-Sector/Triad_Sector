# Variant tool module with better positioned modules and more fuel.
- type: entity
  id: BorgModuleToolAlternative
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: tool cyborg module
  components:
  - type: Sprite
    layers:
    - state: generic
    - state: icon-tools
  - type: ItemBorgModule
    moduleId: Tools # Frontier
    items:
    - JawsOfLife
    - PowerDrill
    - Multitool
    - MaintenanceJack
    - JerryCanNaniteFuel
    - JerryCanWeldingFuel
    - NaniteApplicator
    - WelderIndustrialAdvanced
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: tool-module }

# SD Modules
- type: entity
  parent: [BaseBorgModule, BaseClass2AShipContrabandSilent]
  id: BaseBorgModuleSolarian
  abstract: true
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: tsf
    - state: icon-tsf
  - type: BorgModuleIcon
    icon: { sprite: _Mono/Interface/Action/actions_borg.rsi, state: tsfstandard-weapon-module }
  - type: ItemBorgModule
    moduleId: SolarianDirective
  - type: Tag
    tags:
    - BorgModuleSolarian

- type: entity
  parent: BaseBorgModuleSolarian
  id: BaseBorgModuleSolarianAssault
  abstract: true
  components:
    - type: Tag
      tags:
        - BorgModuleSolarianAssault

- type: entity
  parent: BaseBorgModuleSolarian
  id: BaseBorgModuleSolarianMedical
  abstract: true
  components:
    - type: Tag
      tags:
        - BorgModuleSolarianMedical

- type: entity
  parent: BaseBorgModuleSolarian
  id: BaseBorgModuleSolarianEngineering
  abstract: true
  components:
    - type: Tag
      tags:
        - BorgModuleSolarianEngineering

- type: entity
  parent: [ BaseBorgModuleSolarian, BaseProviderBorgModule, BaseFactionGearSDT2 ]
  id: BorgModuleSDStandardWeapon
  name: solarian directive standard weapon cyborg module
  components:
  - type: ItemBorgModule
    items:
    - WeaponBorgSmartLmgSol # Todo: change to a self-defense pistol?

- type: entity
  parent: [ BaseBorgModuleSolarianAssault, BaseProviderBorgModule, BaseFactionGearSDT2 ]
  id: BorgModuleSDAssaultMelee
  name: solarian directive CQB module
  components:
  - type: ItemBorgModule
    items:
    - EnergySwordBorgSol
    - EnergyShieldBorgSol
    - JawsOfLife

- type: entity
  parent: [ BaseBorgModuleSolarianAssault, BaseProviderBorgModule, BaseFactionGearSDT3 ]
  id: BorgModuleSDAssaultRanged
  name: solarian directive ranged combat module
  components:
  - type: ItemBorgModule
    items:
    - WeaponBorgPulseRifleSol
    - WeaponBorgSmartLmgSol
    - HoloprojectorField
    - JawsOfLife
  - type: BorgModuleIcon
    icon: { sprite: _Mono/Interface/Action/actions_borg.rsi, state: tsfadvanced-weapon-module }

- type: entity
  parent: BorgModuleSDAssaultRanged
  id: BorgModuleSDAdvancedAssaultNpc
  suffix: NPC, Ranged
  components:
  - type: ItemBorgModule
    items:
    - WeaponBorgPulseRifleSol

- type: entity
  parent: BorgModuleSDAssaultMelee
  id: BorgModuleSDAdvancedAssaultMeleeNpc
  suffix: NPC, Melee
  components:
  - type: ItemBorgModule
    items:
    - EnergySwordBorgSolOn
    - EnergyShieldBorgSolOn
