# For TDF, SD, and TIC techdisks, plus whatever factions arrive in the future.

# TIC
- type: entity
  parent: TechDiskBase
  id: TechDiskTICLightGrenade
  name: TIC 18.5 ammunition faction tech disk
  description: A disk capable of adding a variety of 18.5 cartridges to a server's recipes, for faction techfabs.
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#454545"
    - state: label
    - state: protect
    - state: ammo
  - type: TechnologyDisk
    recipes:
    - Magazine185x76mmHighExIncendiary
    - AmmoBox185x76mmHighExIncendiary
    - Magazine185x76mmFragmentationIncendiary
    - AmmoBox185x76mmFragmentationIncendiary
    - Magazine185x76mmHighExRad
    - AmmoBox185x76mmHighExRad

# SD
- type: entity
  parent: TechDiskBase
  id: TechDiskSDLightGrenade
  name: SD 18.5 ammunition faction tech disk
  description: A disk capable of adding a few exotic 18.5 cartridges to a server's recipes, for faction techfabs.
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.DamageStateVisualLayers.Base"]
      color: "#d4d4d4"
    - state: label
    - state: protect
    - state: ammo
  - type: TechnologyDisk
    recipes:
    - Magazine185x76mmAnti-Materiel
    - AmmoBox185x76mmAnti-Materiel
    - Magazine185x76mmEMP
