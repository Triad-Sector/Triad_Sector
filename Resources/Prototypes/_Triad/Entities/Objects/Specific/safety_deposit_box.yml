# Safety Deposit Box Entities

# Base parent for all safety deposit boxes
- type: entity
  parent: BaseStorageItem
  id: SafetyDepositBoxBase
  abstract: true
  components:
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Storage
    blacklist:
      components:
      - IdCard
      - Currency
      - Store
      - EncryptionKey
      - Implant
      - SafetyDepositBox
      - MobState
  - type: SafetyDepositBox
  - type: Appearance
  - type: Tag
    tags:
    - SafetyDepositBox

- type: entity
  parent: SafetyDepositBoxBase
  id: SafetyDepositBox
  name: safety deposit box
  description: A deposit box for storing small valuables. Can hold 3x4 items and is capable of storing small-sized objects.
  components:
  - type: Sprite
    sprite: _Triad/Storage/Cases/depositbox.rsi
    state: icon
  - type: Item
    size: Small
  - type: SafetyDepositBox
    cost: 115000
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,3

- type: entity
  parent: SafetyDepositBoxBase
  id: SafetyDepositBoxMedium
  name: medium safety deposit box
  description: A medium deposit box for storing valuables. Can hold 4x4 items and is capable of storing normal-sized objects.
  components:
  - type: Sprite
    sprite: _Triad/Storage/Cases/medium_depositbox.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SafetyDepositBox
    cost: 155000
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,3

- type: entity
  parent: SafetyDepositBoxBase
  id: SafetyDepositBoxLarge
  name: large safety deposit box
  description: A large deposit box designed to accommodate oversized valuables. Can hold 4x6 items and is capable of storing large objects.
  components:
  - type: MultiHandedItem
  - type: Sprite
    sprite: _Triad/Storage/Cases/large_depositbox.rsi
    state: icon
  - type: Item
    size: Large
  - type: SafetyDepositBox
    cost: 230000
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,3,5

- type: entity
  parent: SafetyDepositBoxBase
  id: SafetyDepositBoxHeavy
  name: heavy safety deposit box
  description: A heavy deposit box built to store exceptionally large valuables. Can hold 6x6 items and is capable of storing ginormous objects.
  components:
  - type: MultiHandedItem
  - type: Sprite
    sprite: _Triad/Storage/Cases/heavy_depositbox.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: SafetyDepositBox
    cost: 340000
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,5,5

- type: entity
  parent: [ComputerBankATMBase, BaseClass2AShipContrabandSilent, BaseStructureDisableToolUse, BaseStructureIndestructible]
  id: SafetyDepositConsole
  name: safety deposit box console
  description: "A console for purchasing and managing safety deposit boxes."
  components:
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _WF/Structures/Machines/atm/depositatm.rsi # Need a new sprite for it
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: SafetyDepositConsole
    boxSlot:
      name: safety-deposit-console-boxSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        tags:
        - SafetyDepositBox
  - type: ContainerContainer
    containers:
      board: !type:Container
      safety-deposit-console-boxSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.SafetyDepositConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SafetyDepositConsoleUiKey.Key:
        type: SafetyDepositConsoleBoundUserInterface
