- type: entity
  name: integrated energy shielding
  parent: EnergyShield
  id: EnergyShieldBorgSol
  description: An advanced shielding unit which partially protects the cyborg when in use. The shield bubble blocks both outgoing and incoming fire, so its not usable alongside projectile weapons and lasers.


- type: entity
  parent: EnergyShield
  id: EnergyShieldBorgSolOn
  suffix: Borg, Toggled On, DO NOT MAP
  categories: [ HideSpawnMenu ]
  components:
