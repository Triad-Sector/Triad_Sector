    activated: true
  - type: Reflect
    reflectProb: 0.5
    damageOnReflectModifier: 0.4
    reflects:
    - Energy
    - NonEnergy
  - type: Blocking
    activeBlockModifier:
      coefficients:
        Blunt: 1.2
        Slash: 0.85
        Piercing: 0.5
        Heat: 0.5
      flatReductions:
        Heat: 1
        Piercing: 1
