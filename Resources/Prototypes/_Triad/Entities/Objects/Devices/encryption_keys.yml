- type: entity
  parent: [ BaseFactionGearTDFT1, EncryptionKey, BaseClass2AShipContrabandSilent ]
  id: EncryptionKeyTdf
  name: TDF encryption key
  categories: [ DoNotMap ]
  description: "An encryption key for the TDF, configured to receive their main channel."
  components:
  - type: EncryptionKey
    channels:
    - Nfsd # TDF main channel
    defaultChannel: Nfsd
  - type: Item
    sprite: _NF/Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: _NF/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_gray
    - sprite: _Triad/Objects/Devices/encryption_keys.rsi
      state: tdf_none_label
  - type: PirateBountyItem
    id: EncryptionKeyFaction

