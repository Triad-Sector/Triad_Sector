#LPC base (just different sprites)
- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipDSID
  name: ship DSID
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Triad/Objects/Misc/dsid_template.rsi

- type: entity
  parent: BaseShipDSID
  id: ShipVoucherEphemere
  name: ephemere dedicated ship id
  description: A small card that contains the data for the procurement of a Ephemere-class DoC ship. Do not lost the DSID
  components:
  - type: Sprite
    layers:
    - state: med_id_handle
    - state: motherboard
    - state: tier_4
    - state: med_logo
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Medical
    companyName: MD
    vessels:
    - Ephemere
  - type: StaticPrice
    vendPrice: 150000

- type: entity
  parent: BaseShipDSID
  id: ShipVoucherTest1
  name: Test Dedicated Ship ID
  description: Test
  components:
  - type: Sprite
    layers:
    - state: tdf_id_handle
    - state: motherboard
    - state: tier_4
    - state: tdf_logo
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Security
    companyName: TDF
    vessels:
    - Ravager
  - type: StaticPrice
    vendPrice: 450000
