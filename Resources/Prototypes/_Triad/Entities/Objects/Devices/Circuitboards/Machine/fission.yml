# Boards for the Far Horizons reactors and turbines. Upstream has none: its stations map them in
# and its cargo sells flatpacks. These build the Salvage variants, which carry no access lock, on
# the centered Triad machine frames. None of them can go through a flatpacker: unpacking only
# checks the one tile under the pack, so a packed reactor would land through whatever stood
# beside it, which the frames exist to prevent.
- type: entity
  id: NuclearReactorSmallMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: small nuclear reactor machine board
  description: A machine printed circuit board for a small nuclear reactor. Uses a centered 3x3 machine frame.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearReactorSmallEmptySalvage
    frameSize: Triad3x3
    flatpackable: false
    requirements:
      Manipulator: 5
      Capacitor: 5
    stackRequirements:
      Plasteel: 10

