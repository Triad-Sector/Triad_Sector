# Boards for the Far Horizons reactors and turbines. They build the Salvage variants on the centered
# Triad frames. Not flatpackable: unpacking checks one tile only.
- type: entity
  id: NuclearReactorSmallMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: small nuclear reactor machine board
  description: A machine printed circuit board for a small nuclear reactor. Uses a 3x3 machine frame.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: NuclearReactorSmallEmptySalvage
    frameSize: Triad3x3
    flatpackable: false
    requirements:
      Manipulator: 5
      Capacitor: 5
    stackRequirements:
      Plasteel: 10

