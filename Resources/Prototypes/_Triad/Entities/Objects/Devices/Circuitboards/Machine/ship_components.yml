- type: entity
  id: LargeThrusterRogueMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: large rogue thruster machine board
  description: A large circuitboard for a 2x2 machine frame.
  components:
  - type: MachineBoard
    prototype: ThrusterLargeRogue
    frameSize: 2x2
    requirements:
