- type: entity
  parent: TriadBasePDA
  abstrct: true
  components:
  - type: Sprite
    sprite: _Triad/Objects/Devices/pda.rsi
    layers:
    - sprite: _NF/Objects/Devices/pda.rsi
      map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: _NF/Objects/Devices/pda.rsi
      state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false

- type: entity
  parent: TriadBasePDA
  id: BaseTdfPDA
  abstract: true
  components:
  - type: Pda
    bookSlot:
      startingItem: HyperlinkBookNfsdSop
      priority: -2
      whitelist:
        tags:
        - BookSpaceLaw
        - BookNfsdSop
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NewsReaderCartridge
    - BountyContractsCartridge
    - AstroNavCartridge
    - WantedListCartridge
  - type: PdaBorderColor
    borderColor: "#515151"
    accentVColor: "#858321"

- type: entity
  parent: BaseTdfPDA
  id: TdfCadetPda
  name: TDF cadet PDA
  description: Bummer. You're just a cadet!
  components:
  - type: Pda
    id: TdfJuniorEnforcerIdCard
    bookSlot:
      startingItem: HyperlinkBookNfsdSop
      priority: -2
      whitelist:
        tags:
        - BookSpaceLaw
        - BookNfsdSop
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-junior-enforcer
  - type: Icon
    state: pda-junior-enforcer

- type: entity
  parent: BaseTdfPDA
  id: TdfPda
  name: TDF PDA
  description: Standard issue PDA for members of the Triad Defense Force.
  components:
  - type: Pda
    id: TdfEnforcerIDCard
    bookSlot:
      startingItem: HyperlinkBookNfsdSop
      priority: -2
      whitelist:
        tags:
        - BookSpaceLaw
        - BookNfsdSop
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-enforcer
  - type: Icon
    state: pda-enforcer

- type: entity
  parent: TdfPda
  id: TdfSectionLeaderPda
  suffix: Section Leader
  components:
  - type: Pda
    id: TdfSectionLeaderIDCard

- type: entity
  parent: BaseTdfPDA
  id: TdfMedicPda
