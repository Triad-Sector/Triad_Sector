  components:
  - type: Pda
    id: TdfMedicIDCard
    bookSlot:
      startingItem: HyperlinkBookNfsdSop
      priority: -2
      whitelist:
        tags:
        - BookSpaceLaw
        - BookNfsdSop
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
