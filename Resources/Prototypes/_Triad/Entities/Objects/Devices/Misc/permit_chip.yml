- type: entity
  parent: BaseItem
  id: PermitChip
  name: TDF permit chip
  description: A small chip used to store the serial number of a controlled item. Hold against controlled item to scan its serial number.
  components:
  - type: Item
    size: Small
    storedRotation: -90
  - type: Sprite
    sprite: _Triad/Objects/Misc/permit_chip.rsi
    state: icon
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/card_pickup.ogg
      params:
        volume: -5
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: SavingContraband
