# Centered variants of Mono's corner-anchored frames, for the Far Horizons reactors and turbines,
# which are centered on their origin. Boards target them by frameSize. 5x5/3x5 art is Mono's 3x3 extended.

#region 5x5
- type: entity
  parent: UnfinishedMachineFrame3x3
  id: TriadUnfinishedMachineFrame5x5
  name: machine frame (5x5)
  components:
  - type: Sprite
    sprite: _Triad/Structure/Machines/frames/frame_5x5.rsi
    state: box_0
    offset: 0,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.25,-2.25,2.25,2.25"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Construction
    graph: TriadMachine5x5
    node: missingWires
    containers:
    - machine_board
    - machine_parts

- type: entity
  parent: MachineFrame3x3
  id: TriadMachineFrame5x5
  name: machine frame (5x5)
  components:
  - type: Sprite
    sprite: _Triad/Structure/Machines/frames/frame_5x5.rsi
    state: box_1
    offset: 0,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.25,-2.25,2.25,2.25"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Construction
    graph: TriadMachine5x5
    node: machineFrame
    defaultTarget: machine
    containers:
    - machine_board
    - machine_parts
  - type: MachineFrame
    frameSize: Triad5x5

- type: entity
  parent: MachineFrameDestroyed3x3
  id: TriadMachineFrameDestroyed5x5
  name: destroyed machine frame (5x5)
  components:
  - type: Sprite
    sprite: _Triad/Structure/Machines/frames/frame_5x5.rsi
    state: destroyed
    offset: 0,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.25,-2.25,2.25,2.25"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Construction
    graph: TriadMachine5x5
    node: destroyedMachineFrame
#endregion

