- type: entity
  parent: [BaseStructureIndestructible, BaseComputerAiAccess, BaseStructureAccessReaderImmuneToEmag]
  id: ComputerContrabandPermit
  name: contraband permit manager
  description: Used to manage, grant, and revoke TDF contraband permits to Triad sector citizens.
  components:
  - type: Sprite
    netsync: false
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Triad/Structure/Machines/computers.rsi
      state: permits
    - map: ["computerLayerKeys"]
      state: security_key
  - type: ActivatableUI
    key: enum.ContrabandPermitConsoleUi.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.ContrabandPermitConsoleUi.Key:
        type: ContrabandPermitConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ItemSlots
    slots:
      permit_slot:
        name: Permit
        ejectSound: /Audio/Machines/id_swipe.ogg
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        priority: 1
        whitelist:
          tags:
          #- Magazine9x19mmSubMachineGunFMJ todo components
  - type: ContainerContainer
    containers:
      board: !type:Container
      permit_slot: !type:ContainerSlot
