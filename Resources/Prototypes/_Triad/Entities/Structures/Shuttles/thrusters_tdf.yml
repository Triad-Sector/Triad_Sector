  id: DebugThrusterTdf
  suffix: DEBUG, TDF
  components:
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/thrustertdf.rsi
  - type: Machine
    board: ThrusterNfsdMachineCircuitboard

