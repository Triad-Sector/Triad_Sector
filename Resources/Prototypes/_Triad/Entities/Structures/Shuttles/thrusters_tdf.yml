# TDF Thrusters and gyros have built in bluespace parts, but can't be deconstructed or saved.

- type: entity
  parent: [ BaseThruster, BaseClass2AShipContrabandSilent ]
  id: ThrusterTdf
  name: bluespace thruster
  suffix: TDF
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/thrustertdf.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: Thruster
    thrust: 410 # Same as bluespace-upgraded gyro
    baseThrust: 410
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#99FF99"
    scale: 1
    shape: diamond
    gridConfig:
      color: "#99FF99"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-0.5,0.5,0.5"

- type: entity
  parent: [ ThrusterTdf, BaseClass2AShipContrabandSilent ]
  id: ThrusterLargeTdf
  name: large bluespace thruster
  suffix: TDF
  placement:
    mode: AlignTileAny
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-1.45,1.45,0.45"
        density: 1750
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Thruster
    thrust: 1640  # Same as bluespace-upgraded thruster
    baseThrust: 1640
    burnShape: ["-0.2,0.5","0.5,5.6","1.2,0.5","0.5,-1.2","-0.2,0.5"]
    originalLoad: 10000
    damage:
      types:
        Heat: 360
  - type: ThrusterProfile
    profile: Large
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/thrustertdf_large.rsi
    offset: 0.5,-0.5
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 2
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: Anchorable
    delay: 10
  - type: Rotatable
    rotateWhileAnchored: false
    increment: 90
  - type: StaticPrice
    price: 1500
  - type: RadarBlip
    visibleFromOtherGrids: true
    radarColor: "#99FF99"
    scale: 2
    shape: diamond
    gridConfig:
      color: "#99FF99"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-0.5,-1.5,1.5,0.5"
  - type: ShipRepairable
    repairTime: 15
    repairCost: 30

- type: entity
  parent: [BaseThruster, BaseClass2AShipContrabandSilent]
  id: GyroscopeTdf
  name: bluespace gryoscope
  suffix: TDF
  components:
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    baseThrust: 4100 # Same as bluespace-upgraded gyro
    thrust: 4100
    heatSignatureRatio: 0.5
  - type: ThrusterProfile
    profile: NeverBlocked
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/tdfgyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: [ "enum.ThrusterVisualLayers.Base" ]
    - state: thrust
      map: [ "enum.ThrusterVisualLayers.ThrustOn" ]
      shader: unshaded
      visible: false
    - state: thrust_burn
      map: [ "enum.ThrusterVisualLayers.Thrusting" ]
      visible: false
    - state: thrust_burn_unshaded
      map: [ "enum.ThrusterVisualLayers.ThrustingUnshaded" ]
      shader: unshaded
      visible: false
  - type: PointLight
    radius: 1.3
    energy: 0.8
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.1" # shine from the top, not bottom of the computer
    color: "#4246b3"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: StaticPrice
    price: 300
  - type: ShipRepairable
    repairTime: 6
    repairCost: 6
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle

- type: entity
  parent: [GyroscopeTdf, BaseClass2AShipContrabandSilent]
  id: SmallGyroscopeTdf
  name: small bluespace gyroscope
  suffix: TDF
  components:
  - type: ShipRepairable
    repairTime: 3
    repairCost: 4
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _NF/Structures/Shuttles/nfsdgyroscope.rsi # TODO - Sprite
    snapCardinals: true
    layers:
    - state: base
      map: [ "enum.ThrusterVisualLayers.Base" ]
    - state: thrust
      map: [ "enum.ThrusterVisualLayers.ThrustOn" ]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: [ "enum.ThrusterVisualLayers.ThrustingUnshaded" ]
      shader: unshaded
      visible: false
  - type: Fixtures # Small gyro, small fixture
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 190
        mask:
        - SmallMobMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: StaticPrice
    price: 100
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    baseThrust: 512 # Same as bluespace-upgraded gyro
    thrust: 512
