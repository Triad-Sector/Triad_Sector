# Triad: propulsion is not contraband. These four carried BaseClass2AShipContrabandSilent, which made
# a store strip the hull rather than refuse it: the drydock purge deletes marked entities wherever
# they sit, so QJ270, QJ340, QJ490 and Zephyr came back without their thrusters and gyroscopes, and
# with the boards and capacitors inside them gone too. The purge stays absolute on purpose - anchoring
# is something a player can do to anything - so the fix belongs here, on the thing wrongly marked.
# TDF hulls are kept out of the drydock by ShipSavingBlacklist on BaseVesselTdf, which is the gate
# that was actually meant to express "a TDF ship is issued, not owned".
- type: entity
  parent: ThrusterLargeNfsd
  id: ThrusterLargeTdf
  suffix: TDF
  components:
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/thrustertdf_large.rsi
  - type: Machine
    board: LargeThrusterTDFMachineCircuitboard

- type: entity
  parent: ThrusterNfsd
  id: ThrusterTdf
  suffix: TDF
  components:
  - type: Sprite
    sprite: _Triad/Structure/Shuttles/thrustertdf.rsi

- type: entity
