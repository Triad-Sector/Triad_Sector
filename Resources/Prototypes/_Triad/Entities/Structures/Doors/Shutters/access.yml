#Blast door

- type: entity
  id: BlastDoorIndestructibleTDF
  parent: BaseBlastDoorIndestructible
  suffix: indestructible, TDF, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsSecurity ]

- type: entity
  id: BlastDoorIndestructibleSyndicate
  parent: BaseBlastDoorIndestructible
  suffix: indestructible, Syndicate, Locked
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsSyndicateAgent ]

