- type: entity
  id: IVDripDeco
  parent: BannerBase
  name: IV drip
  description: A stand with a bag attached for injecting fluids intravenously.
  components:
  - type: Sprite
    sprite: _Triad/Structure/Decoration/banner.rsi
    state: iv-drip
  - type: Destructible #Section copied from bannerbase
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialPlastic1:
            min: 1
            max: 2
          SheetSteel1:
            min: 1
            max: 2

- type: entity
  id: N2OMachineDeco
  parent: IVDripDeco
  name: nitrous-oxide sedation machine
  description: A stand with a breath mask and a canister of air and nitrous oxide, used to sedate patients.
  components:
  - type: Sprite
    state: breath-machine
