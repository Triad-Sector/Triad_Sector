# Triad: TDF BuPers dossier paper-doll exemplars.
# Each entity parents the playable mob of the species and adds:
#   - DossierExemplar (Triad)   : on MapInit, randomizes HumanoidAppearance (skin/hair/markings)
#                                 and applies random species-appropriate gender-aware
#                                 undergarment markings. No jumpsuit, no shoes — uniform
#                                 look across all species, decoupled from clothing-displacement
#                                 rendering quirks per species.
#                                 Lives in Content.Shared so it fires client-side, where the
#                                 guidebook spawns its embedded entities.
# Used as the Entity= reference in Resources/ServerInfo/.../Guidebook/Mobs/<Species>.xml.

- type: entity
  abstract: true
  id: BaseMobDossierExemplar
  categories: [ HideSpawnMenu ]
  components:
  - type: DossierExemplar

- type: entity
  parent: [ MobArachnid, BaseMobDossierExemplar ]
  id: MobArachnidDossierExemplar
  suffix: BuPers Dossier
  categories: [ HideSpawnMenu ]

