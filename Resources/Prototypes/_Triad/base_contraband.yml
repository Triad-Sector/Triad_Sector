# Ship Saving Contraband
- type: entity
  id: BaseClass2AShipContraband
  abstract: true
  components:
  - type: SavingContraband
    examineText: ship-saving-contraband-2a-text

- type: entity
  id: BaseClass2AShipContrabandSilent
  abstract: true
  components:
  - type: SavingContraband

# Contraband permit bases
- type: entity
  id: BaseContrabandPermittable # Use for things that are permittable, but shouldn't be seized on save. Like access breakers.
  abstract: true
  components:
  - type: ContrabandPermittable
    permittable: true # This value exists purely for parenting

- type: entity
  id: BaseShipContrabandPermittable # This one is different than BaseContrabandPermittable, since it is deleted on ship save.
  abstract: true
  components:
  - type: SavingContraband
    examineText: null # ContrabandPermittable gives the examine text
  - type: ContrabandPermittable
    examineText: contraband-permittable-examine-no-save

- type: entity
  parent: BaseShipContrabandPermittable # TDF variant
  id: BaseShipContrabandPermittableTdf
  abstract: true
  components:
  - type: ContrabandPermittable
    examineText: contraband-permittable-examine-tdf
