- type: pointOfInterest
  id: TradeDepot
  parent: [BasePOI, BaseRepairablePOI]
  name: TFA Trade Depot
  minimumDistance: 8000
  maximumDistance: 10000
  spawnGroup: CargoDepot
  gridPath: /Maps/_Triad/POI/tradedepot.yml
  addComponents: &cargoComponents
  - type: IFF
    color: "#37C837"
  - type: ProtectedGrid
    preventArtifactTriggers: true
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
      # Dead zone
      - maxDistance: 500
        prob: 0.0
      - maxDistance: 1000
        prob: 0.3

- type: pointOfInterest
  id: TradeDepotAlt
  parent: [BasePOI, BaseRepairablePOI]
  name: TFA Trade Depot
  minimumDistance: 8000
  maximumDistance: 10000
  spawnGroup: CargoDepot
  gridPath: /Maps/_Triad/POI/tradedepotalt.yml
  addComponents: *cargoComponents

- type: gameMap
  id: TradeDepot
  mapName: 'TFA Trade Depot' # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_Triad/POI/tradedepotalt.yml
  minPlayers: 0
  stations:
    TradeDepot:
      stationProto: StandardFrontierOutpost
      components: &cargoStationComponents
        - type: StationNameSetup
          mapNameTemplate: 'TFA Trade Depot' # Has a letter appended in PointOfInterestSystem
        - type: TradeCrateDestination
          destinationProto: CargoA # Redefined in PointOfInterestSystem

- type: gameMap
  id: TradeDepotAlt
  mapName: 'TFA Trade Depot' # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_Triad/POI/tradedepotalt.yml
  minPlayers: 0
  stations:
    TradeDepotAlt:
      stationProto: StandardFrontierOutpost
      components: *cargoStationComponents
