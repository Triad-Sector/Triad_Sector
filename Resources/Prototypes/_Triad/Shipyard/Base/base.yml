# Separating this for ease of visualization
- type: vessel
  id: BaseVessel
  abstract: true
  name: AAA Bikeshed
  description: Questionably spaceworthy.
  price: 50000
  category: Medium
  group: Shipyard
  addComponents:
  - type: IFF
    color: '#FFFFFFFF'
    flags: [IsPlayerShuttle]

- type: vessel
  parent: BaseVessel
  id: BaseVesselFaction
  abstract: true
  addComponents:
  - type: ShipSavingBlacklist

- type: vessel
  parent: BaseVesselFaction
  id: BaseVesselTdf
  abstract: true
  description: Hell yeah.
  priorityDockTag: DockTdf

- type: vessel
  parent: BaseVessel
  id: BaseVesselAntag
  abstract: true
  addComponents:
  - type: IFF
    flags: [IsPlayerShuttle, HideLabel]
  # Triad: this base is a radar signature, not a save policy. It carried ShipSavingBlacklist until the
  # black market and carrier hulls stopped being faction ships; gating them was hiding a defect in the
  # save path rather than expressing a rule, since IsInvalidEntity short-circuits on contraband before
  # it reaches the anchored check and strips fixtures a hull needs to fly. Anything these ships lose
  # across a round trip is fixed where it is lost, and the roster sweep is what says what that is.
