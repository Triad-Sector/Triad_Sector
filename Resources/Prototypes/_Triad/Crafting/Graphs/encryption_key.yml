# Essentially, this gives you the option to choose which fireteam channels your encryption key connects you to.
# Using a screwdriver on the key will swap you to the next configuration, in this order:
# -> None -> Alpha only -> Bravo only -> Charlie only, All ->
- type: constructionGraph
  id: TdfEncryptionKeySwapGraph
  start: swap_none
  graph:
  - node: swap_none
    entity: EncryptionKeyTdf
    edges:
    - to: swap_alpha
      steps:
      - tool: Screwing
        doAfter: 0.1
  - node: swap_alpha
    entity: EncryptionKeyTdf1
    edges:
    - to: swap_bravo
      steps:
      - tool: Screwing
        doAfter: 0.1
  - node: swap_bravo
    entity: EncryptionKeyTdf2
    edges:
    - to: swap_charlie
      steps:
      - tool: Screwing
        doAfter: 0.1
  - node: swap_charlie
    entity: EncryptionKeyTdf3
    edges:
    - to: swap_all
      steps:
      - tool: Screwing
        doAfter: 0.1
  - node: swap_all
    entity: EncryptionKeyTdfAll
    edges:
    - to: swap_none
      steps:
      - tool: Screwing
        doAfter: 0.1
