# Triad: the TFA High Command outpost, on a map of its own rather than as a point of interest.
# A POI loads onto the sector map, where the grid stays physically reachable and HideWarp/IFF only unlist
# it. A private map has no route in, so ghost warp and a cleared hull are the only ways through.
- type: entity
  id: HighCommandOutpost
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: HighCommandOutpostRule
    gridPath: /Maps/_Triad/Admin/highcommandoutpost.yml
    stationConfig:
      stationProto: TfaHighCommandOutpostStation
      components:
      - type: StationNameSetup
        mapNameTemplate: 'TFA High Command'
      - type: StationJobs
        availableJobs:
          TfaHighCommandRep: [ 2, 2 ]
          TfaHighCommandIntern: [ 3, 3 ]

- type: entity
  id: TfaHighCommandOutpostStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
