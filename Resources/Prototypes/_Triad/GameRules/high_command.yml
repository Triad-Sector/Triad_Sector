# The TFA High Command outpost, on a map of its own. HighCommandOutpostRuleSystem says why it is not a POI.
- type: entity
  id: HighCommandOutpost
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: HighCommandOutpostRule
    gridPath: /Maps/_Triad/Admin/highcommandoutpost.yml
    stationConfig:
      stationProto: TfaHighCommandOutpostStation
      components:
      - type: StationNameSetup
        mapNameTemplate: 'TFA High Command'
      - type: StationJobs
        availableJobs:
          TfaHighCommandRep: [ 2, 2 ]
          TfaHighCommandIntern: [ 3, 3 ]

- type: entity
  id: TfaHighCommandOutpostStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
