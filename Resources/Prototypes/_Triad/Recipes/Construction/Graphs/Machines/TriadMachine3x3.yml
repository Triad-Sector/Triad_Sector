# Mono's Machine3x3 graph with two changes: the frame entities build around their center tile, so
# a machine that is itself centered on its origin (the Far Horizons reactors and turbines) lands
# where the frame stood; and the finished machine has no deconstruct edge, because the reactor's
# rod slots are not construction-managed containers and prying it apart would delete their contents.
- type: constructionGraph
  id: TriadMachine3x3
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: missingWires
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: Steel
              amount: 45
              doAfter: 7.5
        - to: destroyedMachineFrame
          steps:
            - material: Steel
              amount: 45
              doAfter: 7.5

    - node: missingWires
      entity: TriadUnfinishedMachineFrame3x3
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: machineFrame
          conditions:
            - !type:EntityAnchored
          steps:
            - material: Cable
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 45
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 6

    - node: machineFrame
      entity: TriadMachineFrame3x3
      actions:
        - !type:AddContainer
          container: machine_parts
        - !type:AddContainer
          container: machine_board
        - !type:MachineFrameRegenerateProgress
      edges:
        - to: machine
          conditions:
            - !type:EntityAnchored
            - !type:MachineFrameComplete
              guideIconBoard:
                sprite: Objects/Misc/module.rsi
                state: id_mod
              guideIconParts:
                sprite: _NF/Objects/Misc/stock_parts.rsi
                state: scan_module
          steps:
            - tool: Screwing
              doAfter: 1.3

        - to: machineFrame
          conditions:
            - !type:EntityAnchored
            - !type:ContainerNotEmpty
              container: machine_board
          steps:
            - tool: Prying
              doAfter: 6
              completed:
                - !type:EmptyAllContainers
                - !type:MachineFrameRegenerateProgress

        - to: missingWires
          conditions:
            - !type:EntityAnchored
            - !type:ContainerEmpty
              container: machine_board
              examineText: construction-condition-machine-container-empty
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
          steps:
            - tool: Cutting
              doAfter: 0.75

    - node: machine
      entity: !type:BoardNodeEntity { container: machine_board }

    - node: destroyedMachineFrame
      entity: TriadMachineFrameDestroyed3x3
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 10
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 27
            - !type:DeleteEntity {}
