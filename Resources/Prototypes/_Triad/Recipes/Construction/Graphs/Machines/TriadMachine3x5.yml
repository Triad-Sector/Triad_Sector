# Mono's Machine3x3 graph scaled to a 3x5 box, centered and without a deconstruct edge.
# See TriadMachine3x3.yml. Steel scales with tile count, 5 sheets per tile.
- type: constructionGraph
  id: TriadMachine3x5
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
        - !type:DeleteEntity
      edges:
        - to: missingWires
          completed:
            - !type:SetAnchor
              value: false
          steps:
            - material: Steel
              amount: 75
              doAfter: 8
        - to: destroyedMachineFrame
          steps:
            - material: Steel
              amount: 75
              doAfter: 8

    - node: missingWires
      entity: TriadUnfinishedMachineFrame3x5
      actions:
        - !type:EmptyAllContainers
      edges:
        - to: machineFrame
          conditions:
            - !type:EntityAnchored
          steps:
            - material: Cable
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 75
            - !type:DeleteEntity
          steps:
            - tool: Screwing
              doAfter: 7

    - node: machineFrame
      entity: TriadMachineFrame3x5
      actions:
        - !type:AddContainer
          container: machine_parts
        - !type:AddContainer
          container: machine_board
        - !type:MachineFrameRegenerateProgress
      edges:
        - to: machine
          conditions:
            - !type:EntityAnchored
            - !type:MachineFrameComplete
              guideIconBoard:
                sprite: Objects/Misc/module.rsi
                state: id_mod
              guideIconParts:
                sprite: _NF/Objects/Misc/stock_parts.rsi
                state: scan_module
          steps:
            - tool: Screwing
              doAfter: 1.3

        - to: machineFrame
          conditions:
            - !type:EntityAnchored
            - !type:ContainerNotEmpty
              container: machine_board
          steps:
            - tool: Prying
              doAfter: 6
              completed:
                - !type:EmptyAllContainers
                - !type:MachineFrameRegenerateProgress

        - to: missingWires
          conditions:
            - !type:EntityAnchored
            - !type:ContainerEmpty
              container: machine_board
              examineText: construction-condition-machine-container-empty
          completed:
            - !type:SpawnPrototype
              prototype: CableApcStack1
          steps:
            - tool: Cutting
              doAfter: 0.75

    - node: machine
      entity: !type:BoardNodeEntity { container: machine_board }

    - node: destroyedMachineFrame
      entity: TriadMachineFrameDestroyed3x5
      edges:
        - to: start
          steps:
            - tool: Welding
              doAfter: 11
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 45
            - !type:DeleteEntity {}
