- type: construction
  name: plastitanium window
  id: plastitaniumWindow
  graph: Plastitanium
  startNode: start
  targetNode: plastitaniumWindow
  category: construction-category-structures
  canBuildInImpassable: true
  description: One of the most robust window options out there, expensive but worth the price.
  conditions:
  - !type:EmptyOrWindowValidInTile
  - !type:NoWindowsInTile
  icon:
    sprite: Structures/Windows/plastitanium_window.rsi
    state: full
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false

- type: construction
  name: diagonal plastitanium window
