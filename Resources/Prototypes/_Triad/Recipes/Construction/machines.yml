# The construction ghost is drawn from the recipe icon, so each icon is the frame's own box_1
# state, centered like the frame; Mono's icon RSIs draw the box a tile off for its corner-origin
# frames. ghostOffset matches the 3x2's half-tile sprite offset.
- type: construction
  id: TriadMachineFrame5x5
  graph: TriadMachine5x5
  startNode: start
  targetNode: machine
  category: construction-category-machines
  name: machine frame (5x5, centered)
  description: A huge machine frame built around its center tile. Takes the nuclear reactor board.
  icon:
    sprite: _Triad/Structure/Machines/frames/frame_5x5.rsi
    state: box_1
  placementMode: SnapgridCenter
  canBuildInImpassable: false

