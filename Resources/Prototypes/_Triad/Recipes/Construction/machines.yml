# The construction menu draws `icon` at native pixel size, so it is a third-scale icon of the
# frame (frame_icons.rsi, one 54 px canvas so the footprints stay proportional). The ghost draws
# `layers`, so that is the frame's own box_0 state, centered like the frame; Mono's icon RSIs draw
# the box a tile off for its corner-origin frames. ghostOffset matches the 3x2's half-tile sprite
# offset.
- type: construction
  id: TriadMachineFrame5x5
  graph: TriadMachine5x5
  startNode: start
  targetNode: machine
  category: construction-category-machines
  name: machine frame (5x5)
  description: A huge machine frame built around its center tile. Takes the nuclear reactor board.
  icon:
    sprite: _Triad/Structure/Machines/frames/frame_icons.rsi
    state: 5x5
  layers:
  - sprite: _Triad/Structure/Machines/frames/frame_5x5.rsi
    state: box_0
  placementMode: SnapgridCenter
  canBuildInImpassable: false

