# Triad: Construction menu entries for bathroom fixtures.
# Toilet is already registered in the base game (Recipes/Construction/furniture.yml).

- type: construction
  id: SinkConstruct
  name: sink
  description: A stemmed basin with a faucet. Refills with water automatically.
  graph: SinkGraph
  startNode: start
  targetNode: sink
  category: construction-category-furniture
  icon:
    sprite: Structures/Furniture/sink.rsi
    state: sink_stem
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

- type: construction
  id: SinkWideConstruct
  name: wide sink
  description: A wider basin with a faucet. Refills with water automatically.
  graph: SinkGraph
