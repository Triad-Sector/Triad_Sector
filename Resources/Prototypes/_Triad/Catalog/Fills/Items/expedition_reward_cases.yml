- type: entity
  parent: BaseItem
  id: ExpeditionCaseReward
  name: expedition reward case
  description: A case full of credits, a reward for your successful expeditions.
  abstract: true
  suffix: Money
  components:
  - type: Sprite
    sprite: _Triad/Storage/Cases/reward_case.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _Triad/Storage/Cases/reward_case.rsi
  - type: IgnoreMarketModifier # Worth exactly what it says.
  - type: SpawnItemsOnUse
    items:
      - id: SpaceCash10000
    sound:
      path: /Audio/Machines/windoor_open.ogg

- type: entity
  parent: ExpeditionCaseReward
  id: ExpeditionCaseRewardT1
  name: expedition cash case
  suffix: Money
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: tier1
      shader: unshaded
    - state: glow
      shader: unshaded
  - type: SpawnItemsOnUse
    items:
      - id: SpaceCash20000
    sound:
      path: /Audio/Machines/windoor_open.ogg

- type: entity
  parent: ExpeditionCaseReward
  id: ExpeditionCaseRewardT2
  name: expedition cash case
  suffix: Money
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: tier2
      shader: unshaded
    - state: glow
      shader: unshaded
  - type: SpawnItemsOnUse
    items:
      - id: SpaceCash20000
        amount: 2
    sound:
      path: /Audio/Machines/windoor_open.ogg

- type: entity
