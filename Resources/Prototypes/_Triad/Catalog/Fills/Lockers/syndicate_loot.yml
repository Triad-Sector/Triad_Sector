- type: entity
  parent: LockerSyndicate
  id: LockerSyndicateFilledLowTier
  suffix: Filled, Random Syndicate Gear, Low Tier
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: SyndicateArmoryClosestLootLowTier

- type: entityTable
  id: SyndicateArmoryClosestLootLowTier
  table: !type:AllSelector
    children:
    # Utility
    - !type:NestedSelector
      tableId: SyndicateUtilityLowTierTable
      rolls: !type:RangeNumberSelector
        range: 1, 3
    # Bundles
    - !type:NestedSelector
      tableId: SyndicateBundleLowTierTable
      prob: 0.5
      rolls: !type:RangeNumberSelector
        range: 1, 2
    # TC
    - !type:NestedSelector
      tableId: SyndicateTelecrystalLowTierTable
      rolls: !type:RangeNumberSelector
        range: 0, 2
    # Weapons
    - !type:NestedSelector
      tableId: SyndicateWeaponsLowTierTable

- type: entityTable
  id: SyndicateUtilityLowTierTable
  table: !type:GroupSelector
    children:
    # Common Group
    - !type:GroupSelector
      weight: 75
      children:
      # Interdyne specialty
      - !type:AllSelector
        children:
        - id: CigPackSyndicate
        - id: ChemistryBottleOmnizine
      # Tools
      - !type:GroupSelector
        children:
        - id: CameraBug
        - id: ClothingBackpackDuffelSyndicateFilledMedical
        - id: SyndicateJawsOfLife
        - id: JetpackBlackFilled
        - id: ClothingMaskGasVoiceChameleon
        - id: RadioJammer
        - id: ToolboxSyndicateFilled
        - id: CyberPen
          amount: !type:RangeNumberSelector
            range: 2, 3 # Why would the syndicate be having a closet with just ONE cyberpen?
        - id: AgentIDCard
        - id: NaniteApplicatorSyndicate
          weight: 0.3
        - id: ClothingShoesBootsMagSyndie
        # Biosuit
        - !type:AllSelector
          children:
          - id: ClothingHeadHatHoodBioArmoredSyndicate
          - id: ClothingOuterBioArmoredSyndicate
    # Uncommon Group
    - !type:GroupSelector
      weight: 25
      children:
      # Hacking tools
      - !type:GroupSelector
        children:
        - id: Emag
        - id: AccessBreaker
          weight: 0.35
      - id: ClothingEyesThermalVisionGogglesSyndie
      - id: ClothingEyesNightVisionGogglesSyndie

- type: entityTable
  id: SyndicateBundleLowTierTable
  table: !type:GroupSelector
    children:
    # Common Group
    - !type:GroupSelector
      weight: 75
      children:
      - id: ClothingBackpackDuffelSyndicateEVABundle
      - id: ClothingBackpackDuffelSyndicateAmmoFilled
      - id: ClothingBackpackDuffelSyndicateC4tBundle
      - id: BriefcaseSyndieLobbyingBundleFilled
      - id: ClothingBackpackDuffelSyndicatePyjamaBundle
      - id: ClothingBackpackDuffelSyndicateCostumeClown
      - id: ClothingBackpackDuffelSyndicateCarpSuit
      - id: CombatBakeryKit
      - id: ClothingBackpackSyndicate
      - id: ClothingBackpackDuffelSyndicateHardsuitExtrasBundle
      - id: ClothingBackpackDuffelSyndicateDecoyKitFilled
    # Uncommon Group
    - !type:GroupSelector
      weight: 25
      children:
      - id: ClothingBackpackDuffelSyndicateMedicalBundleFilled
      - id: StimkitFilled
      # Suits
      - !type:GroupSelector
        weight: 0.15
        children:
        - id: ClothingBackpackDuffelSyndicateRaidBundle
          weight: 0.75
        - id: ClothingBackpackDuffelSyndicateBundleSamurai
          weight: 0.75
        - id: ClothingBackpackDuffelSyndicateHardsuitBundle
        - id: ClothingBackpackDuffelSyndicateEliteHardsuitBundle
          weight: 0.2
        - id: ClothingBackpackDuffelSyndicateMedicHardsuitBundle
        - id: ClothingBackpackDuffelSyndicateStealthHardsuitBundle
          weight: 0.5
        - id: ClothingBackpackDuffelClothingOuterHardsuitAshenBundle
        - id: ClothingBackpackDuffelSyndicateEVABundle
          weight: 0.5

- type: entityTable
  id: SyndicateTelecrystalLowTierTable
  table: !type:GroupSelector
    children:
    # Common
    - !type:GroupSelector
      weight: 75
      children:
      - id: Telecrystal5
      - id: FoodPacketChocolateTrash # Nothing
    # Uncommon Group
    - !type:GroupSelector
      weight: 23
      children:
      - id: Telecrystal5
        weight: 2
      - id: Telecrystal25
        weight: 0.01
      - id: FoodPacketChocolateTrash # Nothing
    # Rare Group
    - !type:GroupSelector
      weight: 2
      children:
      - id: Telecrystal5
        amount: !type:RangeNumberSelector
          range: 1, 2
      - id: Telecrystal25
        weight: 0.1

- type: entityTable
  id: SyndicateWeaponsLowTierTable
  table: !type:GroupSelector
    children:
    # Common Group
    - !type:GroupSelector
      weight: 90
      children:
      - id: ExGrenade
      - id: GrenadeIncendiary
      - id: GrenadeShrapnel
      - id: PenExplodingBox
      - id: WhiteholeGrenade
      - id: ToolboxElectricalTurretFilled
      - id: ClothingHandsGlovesNorthStar
      - id: ThrowingKnivesKit
      - id: EnergyDaggerBox
      - id: WeaponSniperMosin
        amount: !type:RangeNumberSelector
          range: 1, 5
      - id: WeaponPistolCobra
      - id: WeaponRevolverPythonAP
      - id: WeaponPistolViper
      - id: ClothingBackpackDuffelSyndicateFilledSMG
      - id: BorgModuleSyndicateWeapon
      - id: HypoDartBox
      - id: L58Flatpack
      - id: AK570Flatpack
      - id: ClothingBackpackDuffelSyndicateFilledAtreides
      - id: WeaponCaseLongAK220
    # Rare Group
    - !type:GroupSelector
      weight: 10
      children:
      - id: ExGrenade
        amount: !type:RangeNumberSelector
          range: 1, 3
      - id: ClusterGrenade
      - id: SingularityGrenade
      - id: ClothingBeltMilitaryWebbingGrenadeFilled
        weight: 0.25
      - id: ClothingBackpackDuffelSyndicateFilledShotgun
        weight: 0.25
      - id: EnergyShield
      - id: EnergySword
        weight: 0.25
      - id: AntimovCircuitBoard
        weight: 0.01
      - id: MicroBombImplanter
        weight: 0.01
      - id: BoxHoloparasite
      - id: Type35Flatpack

- type: entity
