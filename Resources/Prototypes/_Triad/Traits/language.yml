# Foreigner, making you lose access to Andromeda Standard, for RP value. Foreigners get extra language slots.
- type: trait
  id: Foreigner
  name: trait-language-foreigner-name
  description: trait-language-foreigner-desc
  category: LanguageTraits
  cost: 0
  grantsCategorySlots:
    LanguageTraits: 2
  priority: -2 # Triad - Lower priority so language traits are applied first
  effects:
  - !type:AddCompsEffect
    components:
    - type: ForeignerTrait
      baseTranslator: TranslatorForeigner

# No natural language. This removes your natural (species) language
- type: trait
  id: NoNaturalLanguage
  name: trait-language-no-natural-language-name
  description: trait-language-no-natural-language-desc
  category: LanguageTraits
  cost: 0
  grantsCategorySlots:
    LanguageTraits: 1
  conditions:
  - !type:IsSpeciesCondition
    species: Human
    invert: true
  - !type:IsSpeciesCondition
    species: Shadekin
    invert: true
  - !type:IsSpeciesCondition
    species: Ovinia
    invert: true
  - !type:IsSpeciesCondition
    species: Oni
    invert: true
  - !type:IsSpeciesCondition
    species: Chitinid
    invert: true
  - !type:IsSpeciesCondition
    species: Goblin
    invert: true
  - !type:IsSpeciesCondition
    species: Feroxi
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
    - type: LanguageSpeaker
  - !type:RemoveNaturalLanguageTraitEffect
    
