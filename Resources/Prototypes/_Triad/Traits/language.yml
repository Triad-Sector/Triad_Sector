# The tajaran language, Siik'Maas
- type: trait
  id: SiikMaas
  name: trait-language-SiikMaas-name
  description: trait-language-SiikMaas-desc
  category: LanguageTraits
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: LanguageSpeaker
  - !type:AddLanguagesEffect
    understood: true
    spoken: true
    languages:
    - SiikMaas

# Andromeda Standard Sign Language (AS-SL)
- type: trait
  id: SignLanguage
  name: trait-language-signlanguage-name
  description: trait-language-signlanguage-desc
  category: LanguageTraits
  cost: 0
  conditions:
  # Signing needs hands. Block for a DOUBLE arm amputee
  - !type:AllOfCondition
    invert: true
    tooltip: trait-condition-needs-an-arm
    conditions:
    - !type:HasTraitCondition
      trait: ArmAmputeeLeft
    - !type:HasTraitCondition
      trait: ArmAmputeeRight
  effects:
  - !type:AddCompsEffect
    components:
    - type: LanguageSpeaker
  - !type:AddLanguagesEffect
    understood: true
    spoken: true
    languages:
    - Sign

