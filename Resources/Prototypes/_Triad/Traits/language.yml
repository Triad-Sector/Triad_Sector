# Foreigner, making you lose access to Andromeda Standard, for RP value. Foreigners get extra language slots.
- type: trait
  id: Foreigner
  name: trait-language-foreigner-name
  description: trait-language-foreigner-desc
  category: LanguageTraits
  cost: 0
  grantsCategorySlots:
    LanguageTraits: 2
  priority: -2 # Triad - Lower priority so language traits are applied first
  effects:
  - !type:AddCompsEffect
    components:
    - type: ForeignerTrait
      baseTranslator: TranslatorForeigner
