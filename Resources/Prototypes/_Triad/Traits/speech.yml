# New Brooklyn: Triad-original wiseguy borough accent. Replaces the retired upstream Mobster trait as
# the player-selectable choice (the Mobster component still backs the regal rat mob + its role/items).
- type: trait
  id: NewBrooklynAccent
  name: trait-newbrooklyn-accent-name
  description: trait-newbrooklyn-accent-desc
  category: Accents
  cost: 1 # dialect accent; 1 from the Accents point pool (one dialect max).
  conditions:
  - !type:HasFreeAccentSlotCondition # Dwarf/Goblin must clear their native accent (Accentless) first
  effects:
  - !type:AddCompsEffect
    components:
    - type: NewBrooklynAccent

# Neanderthal: player-selectable trait for the enriched upstream CavemanAccent (previously only on a pet
# mob + an admin smite, never pickable). Keeps the upstream CavemanAccent id/component for portability.
- type: trait
  id: NeanderthalAccent
  name: trait-neanderthal-accent-name
  description: trait-neanderthal-accent-desc
  category: Accents
  cost: 1 # dialect accent; 1 from the Accents point pool (one dialect max).
  conditions:
  - !type:HasFreeAccentSlotCondition # Dwarf/Goblin must clear their native accent (Accentless) first
  effects:
  - !type:AddCompsEffect
    components:
    - type: CavemanAccent

# Languages

# Terra Slavic, a derived version of Sol common, inspired by Slavic languages of Earth.
- type: trait
  id: TerraSlavic
  name: trait-language-TerraSlavic-name
  description: trait-language-TerraSlavic-desc
  category: LanguageTraits
  cost: 0 # accents/languages are cosmetic RP, not a point cost.
  effects:
  - !type:AddCompsEffect
    components:
    - type: LanguageSpeaker
  - !type:AddLanguagesEffect
    understood: true
    spoken: true
    languages:
    - TerraSlavic
