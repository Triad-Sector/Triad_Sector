# New Brooklyn: Triad-original wiseguy borough accent. Replaces the retired upstream Mobster trait.
- type: trait
  id: NewBrooklynAccent
  name: trait-newbrooklyn-accent-name
  description: trait-newbrooklyn-accent-desc
  category: Accents
  cost: 1 # dialect accent; 1 from the Accents point pool (one dialect max).
  conditions:
  - !type:HasFreeAccentSlotCondition # Dwarf/Goblin must clear their native accent (Accentless) first
  effects:
  - !type:AddCompsEffect
    components:
    - type: NewBrooklynAccent

# Neanderthal: player-selectable trait for the enriched upstream CavemanAccent.
- type: trait
