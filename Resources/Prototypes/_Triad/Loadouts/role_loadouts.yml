# The Director of Infrastructure is the plant's chief engineer: CE wardrobe plus a curated engineering kit
# (the Plant* groups; the generic Contractor* groups carry too much cross-department gear).
# No GroupTankHarness: NFSpeciesSpecific already forces LoadoutTankHarness (double vox harness otherwise).
- type: roleLoadout
  id: JobPlantManager
  groups:
  - ContractorHead
  - DoINeck
  - PlantManagerJumpsuit
  - PlantGloves
  - PlantManagerBackpack
  - DoIOuterClothing
  - ContractorShoes
  - PlantFace
  - PlantGlasses
  - PlantEars
  - ContractorEncryptionKey
  - PlantTools
  - ContractorBoxSurvival
  - ContractorWallet
  - ContractorCartridge
  - ContractorTrinkets
  - ContractorBureaucracy
  - NFSpeciesSpecific

# The Sector Technician is station-engineer tier. No ID group, keeps the plant ID from starting gear.
- type: roleLoadout
  id: JobPlantTechnician
  groups:
  - PlantTechnicianHead
  - ContractorNeck
  - PlantTechnicianJumpsuit
  - PlantGloves
  - PlantTechnicianBackpack
  - ContractorOuterClothing
  - ContractorShoes
  - PlantFace
  - PlantGlasses
  - PlantBelt
  - PlantEars
  - ContractorEncryptionKey
  - PlantTools
  - ContractorBoxSurvival
  - ContractorWallet
  - ContractorCartridge
  - ContractorTrinkets
  - ContractorBureaucracy
  - NFSpeciesSpecific
  - ContractorFirearm
  - ContractorMag
  - ContractorArmorPlates

# These are admin only roles, but they need a rudimentary loadout so that they do not spawn naked if the jobs are spawned by admins
- type: roleLoadout
  id: JobTfaHighCommandIntern
  groups:
  - ContractorBoxSurvival
  - NFSpeciesSpecific

- type: roleLoadout
  id: JobTfaHighCommandRep
  groups:
  - ContractorBoxSurvival
  - NFSpeciesSpecific
