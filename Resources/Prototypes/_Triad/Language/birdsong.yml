# Language spoken by Harpies.
# Based on music as opposed to a language spoken.
- type: language
  id: Birdsong
  isVisibleLanguage: true
  speech:
   # fontId: Default # Triad Edit - Changed to allow musical notes to appear without rendering error.
   # fontSize: 14 # Triad Edit - Due to nature of the symbols, the size was increased slightly from 13 to 14.
    color: "#46ce83" # Goob Edit - Original "#008ecc"
  obfuscation:
    !type:SyllableObfuscation
    minSyllables: 2
    maxSyllables: 5
    replacement:
    
    - ♪
    - ♫
    - ♪♫
    - ♫♪
    - ♪~
    - ~♪
    - ♫~
    - ~♫
    - ~
    - ♥
    - ♥~
    - ~♥