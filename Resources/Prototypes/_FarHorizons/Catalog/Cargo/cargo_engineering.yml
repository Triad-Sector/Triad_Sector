# Triad: Mono had commented these two out, which left no way to obtain a reactor or turbine at all.
# Re-enabled at 10x upstream's price, the same scaling Mono applied to the parts below.
- type: cargoProduct
  id: NuclearReactorFlatpackPurchase
  icon:
    sprite: _FarHorizons/Interface/FissionGenerator/cargo_icons.rsi
    state: reactor
  product: NuclearReactorFlatpack
  cost: 150000 # Triad - 10x
  category: cargoproduct-category-name-engineering
  group: market

- type: cargoProduct
  id: GasTurbineFlatpackPurchase
  icon:
    sprite: _FarHorizons/Interface/FissionGenerator/cargo_icons.rsi
    state: turbine
  product: GasTurbineFlatpack
  cost: 100000 # Triad - 10x
  category: cargoproduct-category-name-engineering
  group: market

