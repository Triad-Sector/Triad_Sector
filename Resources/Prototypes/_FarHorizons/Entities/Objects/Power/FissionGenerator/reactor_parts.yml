#region Fuel Rods
- type: entity
  id: CerenkiteReactorFuelRod
  parent: BaseReactorFuelRod
  name: Cerenkite Fuel Rod # These are your basic, semi-harmless fuel rods
  description: A basic cerenkite fuel rod, safe but low output.
  components:
  - type: ReactorPart
    material: Cerenkite

- type: entity
  id: UraniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: Low Enrichment Uranium Fuel Rod #Triad start, fuel rod changes+new ones
  description: A standard uranium fuel rod with 5% fissile uranium concentration. #Triad
  components:
  - type: ReactorPart
  - type: PhysicalComposition #Triad, making use of isotropics. 5% enrichment.
    materialComposition:
      UraniumFissile: 50
      UraniumDepleted: 950

- type: entity
  id: HighEnrichedUraniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: High Enrichment Uranium Fuel Rod #Triad
  description: A more active uranium fuel rod with 20% fissile uranium concentration. #Triad
  components:
  - type: ReactorPart
  - type: PhysicalComposition #Triad, making use of isotropics. 20% enrichment.
    materialComposition:
      UraniumFissile: 200
      UraniumDepleted: 800

- type: entity
  id: CladdedPlutoniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: Cladded Plutonium Fuel Rod #Triad
  description: A high activity plutonium fuel rod, cladded with plastitanium for safer handling and improved performance. #Triad
  components:
  - type: ReactorPart
  - type: PhysicalComposition #Triad, making use of isotropics.
    materialComposition:
      Plutonium: 500
      Plastitanium: 500

- type: entity
  id: PlutoniumReactorFuelRod
  parent: BaseReactorFuelRod
  name: High Enrichment Plutonium Fuel Rod #Triad
  description: A very active plutonium fuel rod, mixed with depleted uranium. #Triad
  components:
  - type: ReactorPart
  - type: PhysicalComposition #Triad, prepping to make use of isotropics. 50% enrichment, cause the plutonium is a "mix" of isotopes rn.
    materialComposition:
      Plutonium: 500
      UraniumDepleted: 500
  # Triad: no ghost role; a mind on a rod stalls the ship save.
  #- type: GhostRole
  #  makeSentient: true
  #  allowSpeech: true
  #  allowMovement: false
  #  name: ghost-role-information-plutonium-rod-name
  #  description: ghost-role-information-plutonium-rod-description
  #  rules: ghost-role-information-plutonium-rod-rules
  #  mindRoles:
  #  - MindRoleGhostRoleFreeAgentHarmless
  #- type: GhostTakeoverAvailable
  #- type: SentienceTarget
  #  weight: 2

- type: entity
  id: BananiumReactorFuelRod
  parent: BaseReactorFuelRod
  name: Bananium Fuel Rod
  description: A honk rod for a nuclear reactor.
  components:
  - type: ReactorPart
    material: Bananium

- type: entity
  id: PlasmaReactorFuelRod
  parent: BaseReactorFuelRod
  name: Plasma Fuel Rod
  description: A slightly active fuel rod made of Plasma. Will slowly offgass into a reactor at higher temps. # Triad
  components:
  - type: ReactorPart
    material: Plasma

- type: entity
  id: UraniumGlassReactorFuelRod
  parent: BaseReactorFuelRod
  name: Natural Enrichment Uranium Glass Fuel Rod #Triad
  description: A safer, natural enrichment ceramic uranium fuel rod. 0.7% enrichment. #Triad
  components:
  - type: ReactorPart
    material: UraniumGlass

- type: entity
  id: MeatReactorFuelRod
  parent: BaseReactorFuelRod
  suffix: Admeme
  name: Meat Fuel Rod
  description: A fuel rod fo- wait, is it alive?
  components:
  - type: ReactorPart
    material: Meaterial
    properties:
      electrical: 4
      hard: 1
      density: 3
      flammable: 3
      radioactive: 5
#endregion

