# Medical
## Lab coats

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatLabMedical
  name: medical lab coat
  description: A lab coat with light blue accent that protects against minor chemical spill.
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Coats/medical_lab.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Coats/medical_lab.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.75

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatLabSeniorChemist
  name: senior chemistry lab coat
  description: A lab coat that protects against minor chemical spills. Has orange sleeves and an light blue waist trim.
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Coats/chemistry_senior_lab.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Coats/chemistry_senior_lab.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.75

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatLabCybersun
  name: cybersun lab coat
  description: A lab coat that you probably should not rep but the black with orange accent looks too tempting.
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Coats/cybersun_lab.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Coats/cybersun_lab.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.75

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, ClothingOuterCoatLabCybersun]
  id: ClothingOuterCoatLabCybersunOpened
  name: cybersun lab coat

