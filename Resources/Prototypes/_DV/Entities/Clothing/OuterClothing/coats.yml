## Paramedic

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterCoatParamedicJacket
  name: paramedics jacket
  description: A stylish dark blue jacket decorated with white stripes and cross. Nine out of ten paramedic recommend "Do Not Revive."
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Coats/paramedic.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Coats/paramedic.rsi
  - type: TemperatureProtection
    coolingCoefficient: 0.1
    heatingCoefficient: 1.1

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, ClothingOuterCoatParamedicJacket]
  id: ClothingOuterCoatParamedicJacketOpened
  name: paramedic jacket
