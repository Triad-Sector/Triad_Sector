## If you add a new trait, make sure to add the corresponding component to the whitelist in \Resources\Prototypes\Entities\Mobs\Player\clone.yml so it gets copied to clones correctly!

# Triad: Pirate accent, enriched + display name overridden to "Freeport Corsair"
# (trait-freeportcorsair-accent-name). Kept the upstream PirateAccent id/component for portability and
# so the cursed cutlass, pirate uniforms, and pet NPC share the enriched accent.
- type: trait
  id: PirateAccent
  name: trait-freeportcorsair-accent-name
  description: trait-freeportcorsair-accent-desc
  category: Accents
  cost: 2
  effects:
  - !type:AddCompsEffect
    components:
    - type: PirateAccent
# End Triad

- type: trait
  id: SouthernAccent
  name: trait-southern-name
  description: trait-southern-desc
  category: Accents
  cost: 2
  effects:
  - !type:AddCompsEffect
    components:
    - type: SouthernAccent

- type: trait
  id: CowboyAccent
  name: trait-cowboy-name
  description: trait-cowboy-desc
  category: Accents
  cost: 2
  effects:
  - !type:AddCompsEffect
    components:
    - type: CowboyAccent # Triad: promoted from generic ReplacementAccent to the shared drawl engine

- type: trait
  id: ItalianAccent
  name: trait-italian-name
  description: trait-italian-desc
  category: Accents
  cost: 2
  effects:
  - !type:AddCompsEffect
    components:
    - type: ReplacementAccent
      accent: italian

- type: trait
  id: Muted
  name: trait-muted-name
  description: trait-muted-desc
  category: Accents
  cost: 2
  conditions:
  # Triad: restore the BorgChassis exclusion the Real Traits port dropped (was a component blacklist).
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
    - type: Muted

