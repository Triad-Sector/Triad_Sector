# Triad: Muted is a speech DISABILITY, not an accent. Recategorized to Disabilities (free, and correctly
# independent of LANGUAGES: a mute character still understands languages, they just can't speak aloud).
# TODO(Triad): Muted should lock out the entire Accents category (no accent if you can't speak). Implement
# as a category-level condition (e.g. NoTraitInCategory: Accents) so new accents are covered automatically,
# rather than per-accent exclusions that silently break when someone adds an accent without updating Muted.
# Not yet enforced: Muted + an accent is currently selectable (harmless, the accent never renders on muted speech).
- type: trait
  id: Muted
  name: trait-muted-name
  description: trait-muted-desc
  category: Disabilities
  cost: 0
  conditions:
  # Triad: restore the BorgChassis exclusion the Real Traits port dropped (was a component blacklist).
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  effects:
  - !type:AddCompsEffect
    components:
    - type: Muted

