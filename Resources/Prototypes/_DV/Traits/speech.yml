- type: trait
  id: Accentless
  name: trait-accentless-name
  description: trait-accentless-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: Accentless
      removes:
      - type: GoblinAccent # Frontier
      - type: LizardAccent
      - type: MothAccent
      - type: DwarfAccent

- type: trait
  id: SocialAnxiety
  name: trait-socialanxiety-name
  description: trait-socialanxiety-desc
  category: Accents
  cost: 0
  effects:
  - !type:AddCompsEffect
    components:
    - type: StutteringAccent
      matchRandomProb: 0.1
      fourRandomProb: 0
      threeRandomProb: 0
      cutRandomProb: 0

