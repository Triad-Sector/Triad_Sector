- type: entity
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall
  id: HandheldHealthAnalyzer
  name: health analyzer
  description: A hand-held body scanner capable of distinguishing vital signs of the subject.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  # Triad: make health analyzer a useful tool. PDA with medtek lacks this component and therefore can keep the health UI open.
  #- type: ItemToggle
  #  onUse: false
  # End Triad
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    # Triad: Make health analyzer instant to give it a reason to use over the medtek app.
    scanDelay: 0
    maxScanRange: 3
    # End Triad
  - type: Tag
    tags:
    - DiscreteHealthAnalyzer
  - type: GuideHelp
    guides:
    - MedicalDoctor
