#Triad Remade this YML to include a parent base handy flag.
- type: entity
  parent: [BaseItem, RecyclableItemClothSmall] # Frontier: added RecyclableItemClothSmall
  id: BaseHandyFlag
  abstract: true
  name: HandyFlags
  description: "A small handheld flag"
  components:
  - type: Sprite
    sprite: Objects/Misc/HandyFlags.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/HandyFlags.rsi
    size: Small
  - type: PhysicalComposition
    materialComposition:
      Cloth: 2
  - type: HLPersistOnShipSave

- type: entity
  parent: BaseHandyFlag
  id: BlankHandyFlag
  name: blank handheld flag
  description: "Some piece of white cloth wound on a stick."
  components:
  - type: Sprite
    state: blank
  - type: Item
    heldPrefix: blank

- type: entity
  parent: BaseHandyFlag
  id: NTHandyFlag
  name: Nanotrasen handheld flag
  description: "Glory to TSF-NT!"
  components:
  - type: Sprite
    state: NT
  - type: Item
    heldPrefix: NT

- type: entity
  parent: BaseHandyFlag
  id: SynHandyFlag
  name: Syndicate handheld flag
  description: "For truly rebellious patriots. Death to NT!"
  components:
  - type: Sprite
    state: syn
  - type: Item
    heldPrefix: syn

- type: entity
  parent: BaseHandyFlag
  id: LGTBQHandyFlag
  name: LGBTQ handheld flag
  description: "The be gay do crime handy flag."
  components:
  - type: Sprite
    state: pride
  - type: Item
    heldPrefix: pride

- type: entity
  parent: BaseHandyFlag
  id: PirateHandyFlag
  name: Pirate handheld flag
  description: "Holding it in your hands, show these carp that you're not kidding."
  components:
  - type: Sprite
    state: pirate
  - type: Item
    heldPrefix: pirate
#Triad End
