- type: entity
  id: BaseCartridgeCap
  name: cartridge (cap)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeCap
  - type: CartridgeAmmo
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Ammunition/Casings/capgun_casing.rsi # Triad new sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#22f1fc"
  - type: SpentAmmoVisuals
  - type: Appearance
  - type: StaticPrice
    price: 5

- type: entity
  id: CartridgeCap
  name: cap gun cartridge
  parent: BaseCartridgeCap
  components:
  - type: CartridgeAmmo
    proto: BulletCap
