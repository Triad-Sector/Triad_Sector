- type: entity
  name: ritual dagger
  parent: CombatKnife # Change to BaseKnife cause why not - cannot throw
  id: RitualDagger
  description: A strange dagger used by sinister groups for rituals and sacrifices.
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 24
  - type: Item
    size: Small # Triad, similarize all form of knife size
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  name: eldritch blade
  parent: BaseSword # Change to BaseSword cause why not
  id: EldritchBlade
  description: A sword humming with unholy energy.
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.6 # Triad 0.6 < 0.75 
    damage:
      types:
        Slash: 40 #Triad basically similarize with Claymore, speed & damage
    soundHit: # Mono nearly forgot, this weapon makes no noise so i gave it the slash sound, i had been planning on adding this but i forgot until i re-opened the file
      collection: MetalThud
  - type: Item
    size: Huge # Triad Increased from Large to Huge to make damage make more sense
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  name: unholy halberd
  parent: FireAxe # Change to FireAxe for references, and execute
  id: UnholyHalberd
  description: A poleaxe that seems to be linked to its wielder.
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    state: icon
  - type: MeleeWeapon
    heavyStaminaCost: 15 # Triad Addead Stamcost
    wideAnimationRotation: -135
    attackRate: 0.3 # Triad 0.3 < 0.75 
    damage:
      types:
        Blunt: 5 #Triad 5 < 10
        Slash: 10
        Structural: 20 #Triad 20 < 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5 # Triad 5 < 10, blunt can only do so much, slash go br
        Slash: 30 # Triad 30 < 15, increased damage compensate speed
        Structural: 60 # Triad 60 < 30, High structural compensate with slower attack rate
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    quickEquip: false
    slots:
    - back
  - type: UseDelay
    delay: 1
