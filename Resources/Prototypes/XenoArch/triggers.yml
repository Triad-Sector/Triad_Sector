- type: xenoArchTrigger
  id: TriggerRadiation
  tip: xenoarch-trigger-tip-radiation
  sourcing: 3 # Triad: a radium barrel from cargo
  effort: 2 # Triad: and it irradiates you
  schedulability: 2
  components:
  - type: XATDamageThresholdReached
    typesNeeded:
      Radiation: 20

- type: xenoArchTrigger
  id: TriggerPressureHigh
  tip: xenoarch-trigger-tip-pressure-high
  sourcing: 1
  effort: 4 # Triad: over-pressurise your own hull
  schedulability: 2
  components:
  - type: XATPressure
    maxPressureThreshold: 385

- type: xenoArchTrigger
  id: TriggerPressureLow
  tip: xenoarch-trigger-tip-pressure-low
  sourcing: 1
  effort: 4 # Triad: vent a compartment with crew aboard
  schedulability: 2
  components:
  - type: XATPressure
    minPressureThreshold: 50

- type: xenoArchTrigger
