- type: xenoArchTrigger
  id: TriggerConsumeKnowledge
  tip: xenoarch-trigger-tip-knowledge
  sourcing: 4 # Triad: tech disks are not free
  effort: 3
  schedulability: 3
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound: /Audio/Machines/machine_vend.ogg
    whitelist:
      components:
      - TechnologyDisk
      tags:
      - Book

- type: xenoArchTrigger
  id: TriggerConsumeCarbs
  tip: xenoarch-trigger-tip-carbs
  sourcing: 3 # Triad: a food crate
  effort: 3 # Triad: then feed it item by item
  schedulability: 3
  components:
  - type: XATInteractWith
    destroyAfter: true
    interactionTime: 1.5
    successTriggerSound:
      collection: eating
      params:
        volume: 5
    whitelist:
      tags:
      - Bread
      - Cake
      - DonkPocket
      - Donut
      - Pie
      - Pizza

- type: xenoArchTrigger
