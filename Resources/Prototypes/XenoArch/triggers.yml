# Triad: every trigger carries three authored difficulty axes, 1 to 5 each, blended in
# SharedXenoArtifactSystem.Triad. A trigger left on the defaults is a silent mid-tier rating.
#   sourcing       can you obtain what it needs? 1 nothing .. 5 another crew
#   effort         what does performing it cost once you have the thing? 1 a click .. 5 minutes
#   schedulability can you land it on demand inside an unlock window? 1 instant .. 5 external clock
# Rated for a shipfork crew of one to eight in a hull with whatever fittings they paid for, not a station.
# Standing rule: if a trigger cannot fit one unlock window it does not belong in the pool at any price,
# because an unsolvable node orphans its whole subgraph.

- type: weightedRandomXenoArchTrigger
  id: DefaultTriggers
  weights:
    TriggerMusic: 1
    TriggerHeat: 1
    TriggerCold: 0.5
    # Triad: removed the gas family. "Hold gas X near it" seven times over is not a puzzle, and
    # CO2 and NoOxygen are ambiently satisfiable, which inverts the difficulty curve at depth.
    #TriggerNoOxygen: 1
    TriggerWater: 1
    #TriggerCO2: 0.5
    #TriggerPlasma: 0.5
    #TriggerN2O: 0.5
    #TriggerTritium: 0.1
    #TriggerAmmonia: 0.1
    #TriggerFrezon: 0.1
    TriggerRadiation: 1
    TriggerPressureHigh: 0.5
    TriggerPressureLow: 1
    TriggerExamine: 1
    TriggerBruteDamage: 1
    #TriggerInteraction: 1 #this one interferes with activating artifact AND brute dmg!
    TriggerWrenching: 0.5
    TriggerPrying: 0.5
    TriggerScrewing: 0.5
    TriggerPulsing: 0.5
    #TriggerTimer: 0.25 # Triad: removed, waiting is not difficulty
    TriggerBlood: 1
    TriggerThrow: 1
    TriggerDeath: 1
    TriggerMagnet: 1
    # Triad: harvested from Wizden. Weights are theirs except Microwave, which Wizden never weighted.
    # ConsumeMoney (minutes of clicking, does not fit a window) and both particle triggers
    # (no accelerator in the sector) are not taken.
    TriggerMicrowave: 0.5
    TriggerConsumeKnowledge: 0.25
    TriggerConsumeCarbs: 1
    TriggerConsumeMeat: 0.5
    TriggerConsumeProduce: 0.5
    TriggerInteractStamp: 1
    TriggerInteractShock: 1
    TriggerAttackStaminaDamage: 1
    TriggerAttackLaser: 0.5

- type: xenoArchTrigger
  id: TriggerMusic
  tip: xenoarch-trigger-tip-music
  sourcing: 3 # Triad: an instrument is a purchase
  effort: 1
  schedulability: 2 # Triad: passive once playing
  components:
  - type: XATCompNearby
    requireComponentWithName: ActiveInstrument
    radius: 2

- type: xenoArchTrigger
  id: TriggerHeat
  tip: xenoarch-trigger-tip-heat
  sourcing: 2 # Triad: welder, or stage a hot room
  effort: 2
  schedulability: 2
  components:
  - type: XATTemperature
    targetTemperature: 373
    triggerOnHigherTemp: true
  - type: XATDamageThresholdReached
    typesNeeded:
      Heat: 20
# This kinda trivializes the difficulty.
#  - type: XATToolUse
#    requiredTool: Welding
#    delay: 5
#    fuel: 10

- type: xenoArchTrigger
  id: TriggerCold
  tip: xenoarch-trigger-tip-cold
  sourcing: 4 # Triad: freezer fitting or EVA
  effort: 3
  schedulability: 2 # Triad: sustained once staged
  components:
  - type: XATTemperature
    targetTemperature: 255
    triggerOnHigherTemp: false
  - type: XATDamageThresholdReached
    typesNeeded:
      Cold: 20

