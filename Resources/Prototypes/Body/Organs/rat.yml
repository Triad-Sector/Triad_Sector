- type: entity
  id: OrganRatLungs
  parent: OrganHumanLungs
  suffix: "rat"
  components:
  - type: Metabolizer
    metabolizerTypes: [ Rat, Animal ] # Triad

- type: entity # Triad
  id: OrganRatHeart # Triad
  parent: OrganAnimalHeart # Triad
  suffix: "rat" # Triad
  components: # Triad
  - type: Metabolizer # Triad
    maxReagents: 2 # Triad
    metabolizerTypes: [ Rat, Animal ] # Triad
- type: entity
  id: OrganRatStomach
  parent: OrganAnimalStomach
  suffix: "rat"
  components:
  - type: Metabolizer # Triad
    metabolizerTypes: [ Rat, Animal ] # Triad
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite
    state: stomach
