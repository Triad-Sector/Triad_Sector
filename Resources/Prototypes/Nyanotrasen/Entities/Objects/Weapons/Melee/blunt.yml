- type: entity
  name: kanabou
  parent: BaseItem
  id: Kanabou
  description: The classic oni weapon, for those that forgo subtlety.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    state: icon
  - type: Item
    size: Huge
    shape:
    - 0,0,1,4 # Kanobu specific size, slight longer than Large size
  - type: MeleeWeapon
    attackRate: 0.6
    range: 1.75
    damage:
      types:
        Blunt: 25 # Triad enough to be on par with Fireaxes
        Structural: 60 # Triad
    # bluntStaminaDamageFactor: 1.60 # 25.6 stamina damage #I # Triad, i have no idea how to count so disable for now
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15 # Triad
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    quickEquip: false
    slots:
    - back

- type: entity
  name: shinai
  parent: BaseItem
  id: Shinai
  description: A bamboo sword, commonly used in kendo. Made some time after the realization that wooden swords hurt a lot.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.25
    range: 1.75
    bluntStaminaDamageFactor: 2.0
    damage:
      types:
        Blunt: 4
    soundHit:
      collection: WoodDestroyHeavy
  - type: StaminaDamageOnHit
    damage: 10
  - type: Item
    size: Normal
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
  - type: DisarmMalus
