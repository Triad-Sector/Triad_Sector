- type: entity
  name: kanabou
  parent: BaseItem
  id: Kanabou
  description: The classic oni weapon, for those that forgo subtlety.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,3,3 # Triad Glaive & Kanobou Shape
  - type: MeleeWeapon
    heavyStaminaCost: 10 # Triad, should give you 9 swings till you stamcrit instead of 6
    attackRate: 0.8
    wideAnimationRotation: -135 # Triad, hopefully fixes weird sprite swinging
    range: 2.50 # Triad, tried to give it a unique trait since Tintreach has Defib and Breaching Hammer has prying.
    damage:
      types:
        Blunt: 15 # Triad changed to be like Breaching Hammer as it's just as slow, and in the same loot pool
        Structural: 50 # Triad
    bluntStaminaDamageFactor: 1.30 # Triad, i have no idea how to count so uh 1.3
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 50 # Triad
        Structural: 250 # Triad
  - type: MeleeThrowOnHit # Triad. Similar throw range to Tintreach, but also slower swing speed
    speed: 6
    distance: 3
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/kanabou.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
# Triad Start - Audio
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/boots_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand # Triad, added sound on throw
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
      params:
        volume: -2

# Triad End - Audio

- type: entity
  name: shinai
  parent: BaseItem
  id: Shinai
  description: A bamboo sword, commonly used in kendo. Made some time after the realization that wooden swords hurt a lot.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.25
    range: 1.75
    bluntStaminaDamageFactor: 2.0
    damage:
      types:
        Blunt: 4
    soundHit:
      collection: WoodDestroyHeavy
  - type: StaminaDamageOnHit
    damage: 10
  - type: Item
    size: Normal
    sprite: Nyanotrasen/Objects/Weapons/Melee/shinai.rsi
  - type: DisarmMalus
