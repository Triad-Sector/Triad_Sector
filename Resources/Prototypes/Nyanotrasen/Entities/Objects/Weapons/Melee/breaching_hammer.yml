- type: entity
  name: breaching hammer
  parent: [BaseItem, BaseContrabandPermittable] # Triad
  id: SecBreachingHammer
  description: A large, heavy hammer with a long handle, used for breaking stones or other heavy material such as the skulls of violent criminals, also perfect for forcing your way trough airlocks.
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/breaching_hammer.rsi
    state: icon
  - type: Item
    size: Large # Triad, changed to be same size as the other hammers of its class.
    shape:
    - 0,0,3,3
  - type: MeleeWeapon
    heavyStaminaCost: 10 # Triad should give you 9 swings till you stamcrit instead of 6
    attackRate: 0.8
    wideAnimationRotation: -135 # Triad
    range: 2
    damage:
      types:
        Blunt: 15
        Structural: 50
    bluntStaminaDamageFactor: 1.30 # Triad decrease to 1.3
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 50
        Structural: 250 # takes about 1 minute to breach a plastitanium wall
  - type: MeleeThrowOnHit # Triad. Less distance than Tintreach but more than the smaller faster hammers.
    speed: 6
    distance: 2.5
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Prying
    force: true # Triad
    pryPowered: true # Triad
    useSound: /Audio/Items/jaws_pry.ogg # Triad
  - type: ToolTileCompatible
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/breaching_hammer.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage # Frontier - Same as axe
#mono edit end
# Triad Start - Audio
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/boots_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
      params:
        volume: -4
# Triad End - Audio
