#Triad Start
- type: entity
  suffix: Dulled
  parent: BaseItem
  id: BaseSwordDulled
  components:
  - type: Item
    size: Large
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/boots_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
      params:
        volume: -4
# Triad End

- type: entity
  name: katana
  suffix: Dulled
  parent: BaseSwordDulled
  id: KatanaDulled
  description: Ancient craftwork made with not so ancient plasteel. This one has been dulled.
  components:
  - type: Tag
    tags:
    - Katana
  - type: Sprite
    sprite: Objects/Weapons/Melee/katana.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
        Slash: 1
  - type: Item
    sprite: Objects/Weapons/Melee/katana.rsi
  - type: Clothing
    sprite: Objects/Weapons/Melee/katana.rsi
    slots:
    - back
    - suitStorage

- type: entity
  name: claymore
  suffix: Dulled
  parent: BaseSwordDulled
  id: ClaymoreDulled
  description: An ancient war blade. This one has been dulled.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/claymore.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 0.6 # Triad similar to claymore
    damage:
      types:
        Blunt: 6
        Slash: 1
  - type: Item
    sprite: Objects/Weapons/Melee/claymore.rsi  
  - type: Clothing
    sprite: Objects/Weapons/Melee/claymore.rsi
    slots:
    - back
    - suitStorage