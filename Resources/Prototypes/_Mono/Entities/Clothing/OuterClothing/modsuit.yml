# Gallóglach

- type: entity
  parent: ClothingModsuitChestplateBase
  id: ClothingModsuitChestplateMercenary
  name: mercenary modsuit chestplate
  description: A well rounded modsuit that focuses on mobility with its Actuator Enhancement System allowing its wearer to leap across the battlefield for rapid redeployment.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Modsuits/mercenary.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  - type: ExplosionResistance
    damageCoefficient: 0.7 # Mono
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.6
        Caustic: 0.45 # Mono
        Radiation: 0.75 # Mono
  - type: StaminaDamageResistance
    coefficient: 0.7 # Mono
