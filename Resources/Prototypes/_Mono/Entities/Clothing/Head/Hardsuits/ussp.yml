- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ] # Triad : at some point, give engi helmets t-ray scanners
  id: ClothingHeadHelmetHardsuitUsspL27
  name: '"Korolev" industrial engineering hardsuit helmet'
  description: A heavy helmet fitted with a thick uranium glass visor.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/ussp_combat.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/ussp_combat.rsi
  - type: PointLight
    color: "#4e88a6"
  - type: PressureProtection
    highPressureMultiplier: 0.03 # 0.08 - > 0.03 : Triad
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
        Radiation: 0.2 # Triad
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

