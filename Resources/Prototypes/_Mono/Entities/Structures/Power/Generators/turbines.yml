# Triad: Far Horizons renamed Turbine to GasTurbine and split it into an abstract base plus
# access mixins. Mono had commented the Engineering AccessReader off the old concrete Turbine
# because these sit on player ships, then locked them per faction here. GasTurbineCrew carries
# that Engineering reader, so parent the abstract base instead and keep the Lock the old base
# used to supply.
- type: entity
  id: GasTurbineShipLock
  abstract: true
  components:
  - type: Lock
    unlockOnClick: false

- type: entity
  id: TurbineUnaffiliated
  parent: [BaseGasTurbine, GasTurbineShipLock]
  suffix: Unaffiliated, Ship Captain Locked
  description: A large turbine used for generating power using hot gas. Locked to the captain of the ship.
  components:
  - type: AccessReader
    access: [["Captain"]]

- type: entity
  id: TurbineTSF
  parent: [BaseGasTurbine, GasTurbineShipLock]
  suffix: TSF FTL Locked
  description: A large turbine used for generating power using hot gas. Locked to the TSF fireteam leaders.
  components:
  - type: AccessReader
    access: [["Armory"]]

- type: entity
  id: TurbinePDV
  parent: [BaseGasTurbine, GasTurbineShipLock]
  suffix: PDV Denasvar Locked
  description: A large turbine used for generating power using hot gas. Locked to the PDV Denasvars.
  components:
  - type: AccessReader
    access: [["PDVCommand"]]

# No use really, but just in case.
- type: entity
  id: TurbineCC
  parent: [BaseGasTurbine, GasTurbineShipLock]
  suffix: Overseer Locked
  description: A large turbine used for generating power using hot gas. Locked to the CC Overseer.
  components:
  - type: AccessReader
    access: [["HeadOfPersonnel"]]

# Small turbines
#
# For use in slightly less-capital-ey ships or small POIs I guess.

- type: entity
  id: TurbineUnaffiliatedSmall
  parent: [BaseGasTurbineSmall, GasTurbineShipLock]
  suffix: Unaffiliated, Ship Captain Locked
  description: A small turbine used for generating power using hot gas. Locked to the captain of the ship. # Triad: was "large", copy-paste from the full-size variant
  components:
  - type: AccessReader
