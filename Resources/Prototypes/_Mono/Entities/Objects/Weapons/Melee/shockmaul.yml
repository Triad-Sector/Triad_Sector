- type: entity
  parent: BaseItem
  id: WeaponShockMaul
  name: tintreach
  description: A hefty hammer designed for violent application of blunt force, and swift application of electrocution after. In a pinch it can serve as a defib, good for saving allies...or taking your time with a hated foe.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Melee/shockmaul.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,3,3
  - type: MeleeWeapon
    heavyStaminaCost: 10 # Triad should give you 9 swings till you stamcrit instead of 6
    attackRate: 0.7 # Added electronics make it slower than the breaching hammer
    range: 2
    damage:
      types:
        Blunt: 15
        Structural: 50
    bluntStaminaDamageFactor: 1.50 # 15 stamina damage
    soundHit:
      path: /Audio/_Triad/Effects/thunkzap.ogg # Triad, thank you to @cup_of_tia on discord for combining these two sounds
    wideAnimationRotation: 270
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 50
        Shock: 10
        Structural: 250
  - type: MeleeThrowOnHit # Triad. More throw range than other hammers, but also slower swing speed
    speed: 6
    distance: 3
  - type: Defibrillator # "OH NO...*I* SAY WHEN I SAY WE'RE DONE"
    zapHeal:
       types:
         Asphyxiation: -40
         Blunt: 15
  - type: DoAfter
  - type: UseDelay
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Melee/shockmaul.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage # Frontier - Same as axe
#mono edit end
# Triad Start - Audio
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/boots_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/sabre_drop.ogg
      params:
        volume: -4
# Triad End - Audio
