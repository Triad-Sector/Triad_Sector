#LPC base (just different sprites)
- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpc.rsi

#Ironman Voucher
- type: entity
  parent: BaseShipVoucher
  id: ShipVoucherFrontierIronMan
  name: Ironman Voucher
  description: Allows purchase of one free Baeg or Framework from the Shipyard. Destroyed on sale.
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: ShipyardVoucher
    vessels:
    - Baeg
    - Framework
    consoleType: Shipyard

# PDV

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherMock
  name: PDV mock LPC
  description: A small card that authorizes the procurement of a Mock aboard the Motley Anne.
  components:
  - type: Sprite
    layers:
    - state: mtech
    - state: stripepdv
    - state: vouchermilitary
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Custom
    companyName: PDV
    vessels:
    - Mock
  - type: StaticPrice
    vendPrice: 30000

