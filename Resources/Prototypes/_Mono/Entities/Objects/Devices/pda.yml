- type: entity
  parent: BasePDA
  id: BasePDVPDA
  description: A basic personal computer for access restriction and organization, manufactured in the Phaethon Dynasty.
  abstract: true
  components:
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NewsReaderCartridge
    - BountyContractsCartridge
    - AstroNavCartridge
    - TriTalkCartridge # Triad
  - type: Sprite
    sprite: _Mono/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Mono/Objects/Devices/pda.rsi
    state: pda

