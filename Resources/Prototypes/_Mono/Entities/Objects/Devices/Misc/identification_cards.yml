# MARK: Medical

- type: entity
  parent: [IDCardStandard]
  id: MedMedicIDCard
  name: emergency responder ID card
  components:
  - type: PresetIdCard
    job: MdMedic
  - type: Sprite
    sprite: _NF/Objects/Misc/id_cards.rsi
    layers:
    - state: default
    - state: idmedicdoc
  - type: Clothing
    sprite: _NF/Objects/Misc/id_cards.rsi
  - type: Item
    heldPrefix: medic

