- type: entity
  id: SpawnPointPDVBorg
  parent: SpawnPointJobBase
  name: pdv cyborg
  components:
  - type: SpawnPoint
    job_id: PdvBorg
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Silicon/chassis.rsi
      state: robot
    - sprite: Mobs/Silicon/chassis.rsi
      state: robot_e

