- type: construction
  name: machine frame (2x1)
  description: A machine under construction. Needs more parts.
  id: MachineFrame2x1
  graph: Machine2x1
  startNode: start
  targetNode: machine
  category: construction-category-machines
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  # Triad: a third-scale menu icon; the 96x32 icon canvas moved to `layers`, which the ghost draws.
  icon:
    sprite: _Triad/Structure/Machines/frames/frame_icons.rsi
    state: 2x1
  # icon:
  #   sprite: _Mono/Structures/Machines/frames/frame_2x1_icon.rsi
  #   state: "icon"
  layers:
  - sprite: _Mono/Structures/Machines/frames/frame_2x1_icon.rsi
    state: "icon"

- type: construction
  name: machine frame (2x2)
  description: A machine under construction. Needs more parts.
  id: MachineFrame2x2
  graph: Machine2x2
  startNode: start
  targetNode: machine
  category: construction-category-machines
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  # Triad: same split as the 2x1.
  icon:
    sprite: _Triad/Structure/Machines/frames/frame_icons.rsi
    state: 2x2
  # icon:
  #   sprite: _Mono/Structures/Machines/frames/frame_2x2_icon.rsi
  #   state: "icon"
  layers:
  - sprite: _Mono/Structures/Machines/frames/frame_2x2_icon.rsi
    state: "icon"

