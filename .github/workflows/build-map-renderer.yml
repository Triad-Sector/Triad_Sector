name: Build & Test Map Renderer

on:
  push:
    branches: [ main, staging, stable ]
    # Triad: changelog-bot commits touch only Resources/Changelog. Filter here rather than in
    # a job `if`: concurrency is per run, so a run whose jobs all skip still cancels the merge
    # commit's run. Keep this off `pull_request`, where a required check that never runs pends.
    paths-ignore: [ 'Resources/Changelog/**' ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, staging, stable ]

# Triad: key PR runs on PR number; only ever cancel PR runs. Cancelling a merge_group entry
# fails the queue, and cancelling a push run abandons main's only test coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # Triad: job takes ~7m.

    steps:
      - name: Checkout Master
        uses: actions/checkout@v7

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build Content.MapRenderer --configuration Release --no-restore /p:WarningsAsErrors=nullable /m

      - name: Run Map Renderer
        run: dotnet run --project Content.MapRenderer Dev

  ci-success:
    # Triad: this aggregator was named after a different workflow. GitHub matches required
    # status checks by name, so two workflows publishing "Build & Test Debug" means the
    # requirement can be satisfied by whichever reports first, and a genuine test failure
    # can be masked by the map renderer passing. Still wrong in wizden, frontier and
    # monolith as of 2026-08-10, so expect this line to conflict on merges.
    #name: Build & Test Debug # Triad: removed, collided with build-test-debug.yml
    name: Build & Test Map Renderer
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
